name: CI

on:
  push:
    branches: [main, 'release/**']
  pull_request:
    branches: [main, 'release/**']

# These jobs only read the repository: third-party code they install must
# not get a token that can write to it.
permissions:
  contents: read

# Cancel superseded runs of a pull request. A push to main or to a release
# branch always runs to the end, so every merged commit keeps its result.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: document-parser

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: document-parser/uv.lock

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends poppler-utils

      - name: Install Python dependencies
        run: uv sync --frozen --group dev

      - name: Lint
        run: uv run ruff check .

      - name: Run tests
        run: uv run pytest tests/ -v

  # The job above installs the `dev` group only, so the tests that need the
  # `docling` library skip themselves (importorskip). This job installs the
  # `local` group (docling, torch and torchvision from the PyTorch CPU index
  # set in pyproject.toml) and runs just those tests. They build converters
  # and mock the conversions: no model is downloaded. It costs a few minutes
  # of wheels, so it runs on pushes to main and release/** and on pull
  # requests to main, not on every pull request to a release branch.
  backend-docling:
    name: Backend tests (docling)
    if: github.event_name == 'push' || github.base_ref == 'main'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: document-parser

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: document-parser/uv.lock
          # Keep this cache apart from the dev-only one of the job above.
          cache-suffix: docling

      - name: Install Python dependencies
        run: uv sync --frozen --group dev --group local

      - name: Check that docling is importable
        # Otherwise the tests below would skip and the job would pass empty.
        run: uv run python -c "import docling; print('docling', docling.__file__)"

      - name: Run docling tests
        run: >
          uv run pytest -v
          tests/test_pipeline_options.py
          tests/test_robustness.py
          tests/test_batch_merge.py
          tests/test_serve_converter.py::TestConverterWiring::test_local_engine_builds_local_converter

  frontend:
    name: Frontend tests & build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npx eslint src/

      - name: Type check
        run: npm run type-check

      - name: Run tests
        run: npm run test:run

      - name: Build
        run: npm run build

  e2e:
    name: E2E API tests (Karate)
    needs: [backend, frontend]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: document-parser/uv.lock

      - uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin
          cache: maven

      - name: Generate test PDFs
        run: |
          uv run --directory document-parser --group ci python ../e2e/generate-test-data.py

      - name: Start stack
        run: docker compose --profile remote up -d --wait --build
        timeout-minutes: 10
        env:
          RATE_LIMIT_RPM: "0"
          # Run E2E against the remote Docling Serve container instead of
          # building a local image that bakes/downloads ~1.3 GB of HF
          # checkpoints. Removes our last HuggingFace Hub dependency in
          # CI (we used to 429 here on shared-IP GHA runners). The
          # docling-serve service is in the `remote` compose profile —
          # see docker-compose.yml.
          CONVERSION_MODE: remote

      - name: Wait for health
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3000/api/health > /dev/null 2>&1; then
              echo "Backend healthy"
              exit 0
            fi
            echo "Waiting for backend... ($i/30)"
            sleep 5
          done
          echo "Backend failed to start"
          docker compose --profile remote logs
          exit 1

      - name: Warm up docling-serve
        run: bash .github/scripts/warmup-docling-serve.sh

      - name: Run E2E tests
        run: |
          KARATE_TAGS="@smoke"
          if [[ "${{ github.base_ref }}" == release/* ]] || [[ "${{ github.ref }}" == refs/heads/release/* ]]; then
            KARATE_TAGS="@smoke,@regression,@e2e"
          fi
          mvn test -f e2e/api/pom.xml -DbaseUrl=http://localhost:3000 -Dkarate.options="--tags ${KARATE_TAGS}"

      - name: Dump docling-serve logs
        if: always()
        run: docker compose --profile remote logs --no-color --tail 200 docling-serve

      - name: Upload Karate reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: karate-api-reports
          path: e2e/api/target/karate-reports/

      - name: Tear down
        if: always()
        run: docker compose --profile remote down

  e2e-ui:
    name: E2E UI tests (Karate UI)
    # Pushes only: main, and release/** so every merge into a release branch
    # gets the @critical journeys before the Release Gate. Pull requests to a
    # release branch skip it to stay fast.
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/release/'))
    needs: [backend, frontend]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: document-parser/uv.lock

      - uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin
          cache: maven

      - name: Install Chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable

      - name: Generate test PDFs
        run: |
          uv run --directory document-parser --group ci python ../e2e/generate-test-data.py

      - name: Start stack
        run: docker compose --profile remote up -d --wait --build
        timeout-minutes: 10
        env:
          RATE_LIMIT_RPM: "0"
          # The @critical UI suite still drives the legacy /studio surface
          # (#257 made it default-off). Enable it for e2e until those tests
          # are rewritten against /docs/:id in 0.7.0. Mirrors release-gate.yml.
          STUDIO_MODE_ENABLED: "true"
          # Same remote-Docling-Serve setup as the API E2E job above —
          # no HF dependency on this runner.
          CONVERSION_MODE: remote

      - name: Wait for health
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3000/api/health > /dev/null 2>&1; then
              echo "Backend healthy"
              exit 0
            fi
            echo "Waiting for backend... ($i/30)"
            sleep 5
          done
          echo "Backend failed to start"
          docker compose --profile remote logs
          exit 1

      - name: Warm up docling-serve
        run: bash .github/scripts/warmup-docling-serve.sh

      - name: Run critical UI tests
        # -Dtest: --tags replaces the tags of every runner method, so without
        # it each critical scenario ran once per UIRunner method.
        run: >
          mvn test -f e2e/ui/pom.xml
          -Dtest='UIRunner#testCritical'
          -DbaseUrl=http://localhost:3000
          -DuiBaseUrl=http://localhost:3000
          -Dkarate.options="--tags @critical"

      - name: Dump docling-serve logs
        if: always()
        run: docker compose --profile remote logs --no-color --tail 200 docling-serve

      - name: Upload Karate UI reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: karate-ui-reports
          path: e2e/ui/target/karate-reports/

      - name: Tear down
        if: always()
        run: docker compose --profile remote down
