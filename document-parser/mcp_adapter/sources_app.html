<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Sources</title>
<style>
  /* Light only, on purpose (#363): the card is read off a projector, and a
     host in dark mode still gets the same high-contrast card. Warm paper
     tones; one accent, the highlighter's orange, for what the answer quotes;
     green only for the server's word that a quote is there. */
  :root {
    color-scheme: light;
    --paper: #f4f3ee;
    --surface: #ffffff;
    --frame: #efede7;
    --ghost: #eeebe5;
    --border: #e6e4dd;
    --border-2: #d6d2c8;
    --line: #d9d5cc;
    --text: #1d1c19;
    --text-2: #3a3934;
    --text-3: #5f5c55;
    --muted: #6f6c64;
    --accent: #b4470f;
    --accent-2: #d9773f;
    --accent-soft: #f9d2b3;
    --accent-bg: #fdf1e8;
    --hl: #fad3b5;
    --ok: #1e7a46;
    --ok-tint: rgba(30, 122, 70, 0.1);
    --bad: #b42318;
    --bad-tint: rgba(180, 35, 24, 0.08);
    --sans: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
    --serif: 'STIX Two Text', 'Times New Roman', Times, serif;
    --mono: 'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { max-width: 100%; }
  body {
    font-family: var(--sans);
    background: transparent;
    color: var(--text);
    font-size: 13px;
    line-height: 1.45;
    -webkit-font-smoothing: antialiased;
  }
  button { font: inherit; color: inherit; }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  /* The card measures itself against `main`, never against the window: the
     host owns the frame width, and a viewport media query asked inside an
     iframe answers a question about the frame, not about the card. */
  main {
    max-width: 820px;
    margin: 0 auto;
    padding: clamp(2px, 1.5vw, 8px);
    container-type: inline-size;
  }
  .card {
    min-width: 0;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    overflow: hidden;
    box-shadow: 0 1px 2px rgba(29, 28, 25, 0.04);
  }
  .mono { font-family: var(--mono); }

  /* ---- header: the document, the switch, the way into Studio ----------- */

  .head { display: flex; align-items: center; gap: 12px; padding: 8px 8px 4px 18px; min-width: 0; }
  .doc { display: flex; align-items: center; gap: 10px; min-width: 0; flex: 1; }
  .doc svg { flex: none; }
  .doc-title { min-width: 0; font-size: 13px; font-weight: 500; color: var(--text-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .switch { flex: none; display: flex; gap: 2px; padding: 2px; border-radius: 8px; background: var(--paper); }
  .switch button {
    border: 0;
    border-radius: 6px;
    min-height: 30px;
    padding: 0 11px;
    font-size: 12px;
    font-weight: 500;
    color: var(--muted);
    background: transparent;
    cursor: pointer;
  }
  .switch button[aria-selected="true"] { background: var(--surface); color: var(--text); box-shadow: 0 1px 2px rgba(29, 28, 25, 0.1); }
  .studio {
    flex: none;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    min-height: 44px;
    padding: 0 10px;
    border: 0;
    background: none;
    font-size: 13px;
    font-weight: 500;
    color: var(--accent);
    cursor: pointer;
  }
  .studio:hover { color: #8a3409; }
  @container (max-width: 560px) {
    .studio .long { display: none; }
    .head { gap: 6px; padding-left: 14px; }
  }

  /* ---- the pages: one thumbnail each, the quoted ones marked ----------- */

  .strip { display: flex; align-items: flex-start; gap: 12px; padding: 6px 18px 10px; }
  .strip .end { flex: none; font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; line-height: 36px; padding-top: 4px; }
  .pages { flex: 1; min-width: 0; display: flex; align-items: flex-start; justify-content: space-between; gap: 3px; padding-top: 4px; }
  .pg { position: relative; display: block; flex: 0 1 28px; min-width: 5px; height: 36px; border-radius: 2px; background: var(--ghost); }
  /* A run of unopened pages in a long document, one bar for the run. */
  .pg.run { flex: 1 1 0; min-width: 6px; }
  .pg.read, .thumb { background: var(--surface); border: 1px solid var(--border-2); }
  .pg.read::before, .thumb::before {
    content: "";
    position: absolute;
    inset: 4px 3px 5px;
    background: repeating-linear-gradient(to bottom, var(--line) 0 1.5px, transparent 1.5px 4px);
  }
  .pick {
    flex: 0 1 36px;
    min-width: 12px;
    padding: 0;
    border: 0;
    background: transparent;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 5px;
    cursor: pointer;
  }
  .thumb { position: relative; display: block; width: 28px; max-width: 100%; height: 36px; border-radius: 2px; outline: 2px solid transparent; outline-offset: 2px; }
  .pick[aria-pressed="true"] .thumb { border-color: var(--accent); outline-color: rgba(180, 71, 15, 0.28); box-shadow: 0 4px 10px rgba(180, 71, 15, 0.18); }
  .pick:hover .thumb { border-color: var(--accent-2); }
  .thumb .mk { position: absolute; left: 2px; right: 2px; min-height: 3px; background: var(--accent-soft); border: 1px solid var(--accent); border-radius: 1px; }
  .thumb .mk.bad { background: var(--bad-tint); border: 1px dashed var(--bad); }
  .pn { font-size: 10.5px; line-height: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .pick[aria-pressed="true"] .pn { color: var(--accent); font-weight: 600; }

  /* ---- the passage on its page ------------------------------------------ */

  .frame { margin: 0 14px; padding: 14px; background: var(--frame); border-radius: 12px; }
  .sheet {
    position: relative;
    height: clamp(210px, 40cqw, 300px);
    overflow: hidden;
    border-radius: 4px;
    background: var(--surface);
    box-shadow: 0 1px 2px rgba(29, 28, 25, 0.08), 0 6px 18px rgba(29, 28, 25, 0.07);
  }
  /* The page fades out at the top and the bottom of the window: it goes on,
     the reader is looking at one passage of it. */
  .window {
    position: absolute;
    inset: 0;
    -webkit-mask-image: linear-gradient(to bottom, transparent 0, #000 34px, #000 calc(100% - 34px), transparent 100%);
    mask-image: linear-gradient(to bottom, transparent 0, #000 34px, #000 calc(100% - 34px), transparent 100%);
  }
  .leaf { position: absolute; left: 0; top: 0; }
  .leaf img { display: block; width: 100%; height: 100%; }
  /* The highlighter: multiplied over the ink, so the text stays black. */
  .hl { position: absolute; background: var(--hl); mix-blend-mode: multiply; border-radius: 2px; pointer-events: none; }
  .hl.other { background: #fce9da; }
  /* Found on the page, but the server did not find it in the parse. */
  .hl.bad { background: rgba(180, 35, 24, 0.16); }
  /* No line found for the quote: the passage's block, softly. */
  .blk { position: absolute; border-radius: 3px; pointer-events: none; }
  .blk.ok { background: var(--hl); mix-blend-mode: multiply; opacity: 0.75; }
  .blk.unchecked { border: 2px dashed var(--accent-2); }
  .blk.bad { border: 2px dashed var(--bad); background: var(--bad-tint); }
  .blk.read { border: 2px solid var(--accent-2); background: rgba(217, 119, 63, 0.06); }
  .folio {
    position: absolute;
    top: 10px;
    right: 14px;
    padding: 1px 6px;
    border-radius: 4px;
    background: var(--surface);
    box-shadow: 0 0 0 4px var(--surface);
    font-size: 11px;
    color: var(--muted);
    font-variant-numeric: tabular-nums;
  }
  .ph { position: absolute; inset: 0; display: grid; place-items: center; padding: 24px; font-size: 12px; text-align: center; color: var(--muted); }
  /* A host that relays no tool call: the quote itself, set like the page. */
  .textonly { position: absolute; inset: 0; display: flex; flex-direction: column; justify-content: center; gap: 10px; padding: 26px 34px; }
  .textonly .q { font-family: var(--serif); font-size: 16.5px; line-height: 1.6; color: var(--text); overflow-wrap: anywhere; }
  .textonly mark { background: var(--hl); color: inherit; padding: 1px 0; -webkit-box-decoration-break: clone; box-decoration-break: clone; }
  .textonly mark.bad { background: rgba(180, 35, 24, 0.16); }
  .textonly small { font-size: 11px; color: var(--muted); }

  .foot { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 14px 18px 16px; min-width: 0; }
  .loc { min-width: 0; font-size: 13px; color: var(--text-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .state { flex: none; display: flex; align-items: center; gap: 10px; }
  .count { font-family: var(--mono); font-size: 11px; color: var(--muted); }
  .verdict { display: flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--text-3); }
  .verdict.bad { color: var(--bad); }

  /* ---- Détails: the rounds and what the reading cost ------------------ */

  .details { padding: 12px 18px 18px; display: flex; flex-direction: column; gap: 20px; border-top: 1px solid var(--border); }
  .kicker { font-size: 11px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--text-3); }
  .ask { display: grid; gap: 4px; }
  .question { font-size: 16px; font-weight: 600; line-height: 1.35; letter-spacing: -0.01em; overflow-wrap: anywhere; }
  .tiles { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }
  @container (max-width: 620px) { .tiles { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  .tile { border: 1px solid var(--border); border-radius: 10px; padding: 11px 12px; display: flex; flex-direction: column; gap: 6px; min-width: 0; }
  .tile-value { font-size: 23px; font-weight: 600; letter-spacing: -0.02em; line-height: 1; }
  .tile-value small { font-size: 14px; color: var(--muted); }
  .tile-value.ok { color: var(--ok); }
  .tile-value.over { color: var(--bad); }
  .tile-sub { font-size: 11px; color: var(--muted); }
  .tile-sub.over { color: var(--bad); font-weight: 600; }
  .meter { height: 5px; border-radius: 3px; background: var(--ghost); overflow: hidden; }
  .meter span { display: block; height: 5px; background: var(--accent-2); }
  .pips { display: flex; gap: 3px; height: 5px; }
  .pips span { flex: 1; border-radius: 2px; background: var(--border); }
  .pips .on { background: var(--accent-2); }
  .pips .over, .pips .bad { background: var(--bad); }
  .pips .ok { background: var(--ok); }
  .pips .unchecked { background: rgba(30, 122, 70, 0.4); }

  .section-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 8px; }
  .section-head .mono { font-size: 11px; color: var(--muted); }
  .coverage { position: relative; padding-bottom: 30px; }
  .segments { display: flex; height: 14px; border-radius: 4px; overflow: hidden; }
  .seg { flex-basis: 0; min-width: 2px; background: var(--ghost); box-shadow: inset -2px 0 0 var(--surface); }
  .seg[data-status="read"] { background: var(--accent-soft); }
  .seg[data-status="cited"] { background: var(--accent-2); }
  .bracket { position: absolute; top: 18px; height: 6px; border: 1.5px solid var(--accent); border-top: 0; border-radius: 0 0 3px 3px; }
  .bracket-label { position: absolute; top: 28px; transform: translateX(-50%); font-size: 10.5px; font-weight: 600; color: var(--accent); white-space: nowrap; }
  .end-label { position: absolute; top: 28px; font-size: 10.5px; color: var(--muted); }
  .end-label.right { right: 0; }
  .keys { display: flex; flex-wrap: wrap; gap: 14px; font-size: 11px; color: var(--text-3); }
  .keys span { display: inline-flex; align-items: center; gap: 5px; }
  .keys i { width: 10px; height: 10px; border-radius: 2px; background: var(--ghost); }
  .keys .read { background: var(--accent-soft); }
  .keys .cited { background: var(--accent-2); }

  .rounds { display: flex; flex-direction: column; }
  .tr {
    display: grid;
    grid-template-columns: 24px minmax(0, 1fr) 54px minmax(80px, 150px) 78px;
    gap: 12px;
    align-items: start;
    padding: 9px 4px;
    border-top: 1px solid var(--border);
  }
  @container (max-width: 620px) { .tr { grid-template-columns: 22px minmax(0, 1fr) 44px 74px; } .tr .cost { display: none; } }
  .tr.th { padding: 0 4px 6px; border-top: 0; font-size: 10px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); }
  .tr.th .cost { height: auto; }
  .tr.unused { color: var(--muted); align-items: center; }
  .tr.total { align-items: center; border-top-color: var(--border-2); background: var(--paper); border-radius: 0 0 6px 6px; }
  .num {
    width: 22px;
    height: 22px;
    border-radius: 6px;
    display: grid;
    place-items: center;
    background: var(--accent-bg);
    color: var(--accent);
    font-family: var(--mono);
    font-size: 11px;
    font-weight: 700;
  }
  .num.over { background: var(--bad); color: #fff; }
  .num.ghost { background: none; border: 1px dashed var(--border-2); color: var(--muted); }
  .what { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
  .what .t { font-size: 12.5px; font-weight: 600; line-height: 22px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .what .why, .what .found { font-size: 12px; line-height: 1.4; color: var(--text-3); overflow-wrap: anywhere; }
  .what b { font-weight: 600; color: var(--text-2); }
  .tr .m { font-family: var(--mono); font-size: 11px; color: var(--text-3); line-height: 22px; }
  .tr.total .t { font-size: 12.5px; font-weight: 600; }
  .cost { display: flex; align-items: center; gap: 8px; height: 22px; }
  .track { position: relative; flex: 1; height: 6px; border-radius: 3px; background: var(--ghost); }
  .track span { position: absolute; left: 0; top: 0; height: 6px; border-radius: 3px; background: var(--accent-2); }
  .cost .m { width: 42px; text-align: right; }
  .flag { justify-self: end; display: inline-flex; align-items: center; gap: 4px; height: 22px; padding: 0 7px; border-radius: 999px; font-size: 10.5px; font-weight: 600; color: var(--text-3); background: var(--paper); white-space: nowrap; }
  .flag.ok { color: var(--ok); background: var(--ok-tint); }
  .flag.bad { color: var(--bad); background: var(--bad-tint); }

  .quotes { display: flex; flex-direction: column; gap: 6px; }
  .quote {
    display: grid;
    grid-template-columns: minmax(0, 1fr) auto;
    gap: 4px 12px;
    width: 100%;
    padding: 9px 12px;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: var(--surface);
    text-align: left;
    cursor: pointer;
  }
  .quote:hover { border-color: var(--accent-2); }
  .quote .q { font-family: var(--serif); font-size: 14px; line-height: 1.45; color: var(--text); overflow-wrap: anywhere; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .quote .q.none { font-family: var(--sans); font-size: 12px; font-style: italic; color: var(--muted); }
  .quote .where { grid-column: 1 / -1; display: flex; align-items: center; gap: 10px; font-size: 11.5px; color: var(--muted); min-width: 0; }
  .quote .where span:first-child { min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .quote .flag { grid-row: 1; grid-column: 2; align-self: start; }

  .tally { font-size: 12px; color: var(--bad); }
  .meta { display: flex; flex-direction: column; gap: 3px; padding-top: 12px; border-top: 1px solid var(--border); }
  .meta .mono { font-size: 10.5px; color: var(--muted); overflow-wrap: anywhere; }
  /* Said once, plainly, on the artefact itself: the `why` and `found` lines
     are the agent's words; everything else is the server's. */
  .caveat { font-size: 11px; color: var(--muted); }

  .fallback { padding: 18px; font-size: 13px; color: var(--text-2); }
</style>
</head>
<body>
<main>
  <div class="fallback" id="root">En attente des sources…</div>
</main>
<script>
  "use strict";

  // Every interpolation of model- or document-derived text goes through this
  // before it becomes markup. The server already defuses the content-wrapper
  // delimiter on its way out; this is the second half of the same promise,
  // because a `why` is a string a model wrote after reading a PDF.
  const esc = (value) =>
    String(value ?? "")
      .replaceAll("&", "&amp;")
      .replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;")
      .replaceAll('"', "&quot;")
      .replaceAll("'", "&#39;");

  // Numbers are coerced before they are formatted, because the result lands
  // in markup unescaped.
  const num = (value) => {
    const number = Number(value);
    return Number.isFinite(number)
      ? String(number).replace(/\B(?=(\d{3})+(?!\d))/g, " ")
      : "—";
  };
  // French figures for a French stage: 9,4.
  const fr = (value, digits = 0) => {
    const number = Number(value);
    return Number.isFinite(number)
      ? number.toLocaleString("fr-FR", { maximumFractionDigits: digits })
      : "—";
  };
  // A fraction of the page as a CSS percentage, clamped to the page.
  const pct = (value) => {
    const number = Number(value);
    return Number.isFinite(number) ? (Math.min(1, Math.max(0, number)) * 100).toFixed(2) : "0";
  };
  const px = (value) => {
    const number = Number(value);
    return Number.isFinite(number) ? number.toFixed(1) : "0";
  };
  const list = (value) => (Array.isArray(value) ? value : []);
  const plural = (count, word) => (Number(count) === 1 ? word : `${word}s`);
  const isLink = (url) => /^https?:\/\//i.test(String(url || ""));

  const ICON = {
    doc:
      '<svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="#b4470f" stroke-width="1.4" ' +
      'stroke-linejoin="round" aria-hidden="true"><path d="M3.5 1.75h5.25l3.75 3.75v8.75h-9z"></path>' +
      '<path d="M8.75 1.75v3.75h3.75"></path></svg>',
    check:
      '<svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="#1e7a46" stroke-width="1.6" ' +
      'stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2.75 7.25l2.75 2.75 5.75-6"></path></svg>',
    cross:
      '<svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.6" ' +
      'stroke-linecap="round" aria-hidden="true"><path d="M3.5 3.5l7 7M10.5 3.5l-7 7"></path></svg>',
    dash:
      '<svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.4" ' +
      'stroke-dasharray="2.2 2" aria-hidden="true"><circle cx="7" cy="7" r="5"></circle></svg>',
    out:
      '<svg width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.5" ' +
      'stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 2.5h5.5V8"></path>' +
      '<path d="M9.5 2.5L2.5 9.5"></path></svg>',
  };

  // ---- what a citation's status means on the card ------------------------
  // Three looks, all earned by the server checking the quote again: green
  // (it is there), red (it is not), and a dashed circle for an anchor that
  // came without a quote — cited, never called verified.

  const OK = new Set(["verified", "stale_version"]);
  const tone = (passage) =>
    OK.has(passage.status) ? "ok" : passage.status ? "bad" : "unchecked";
  const verdict = (passage) => {
    if (passage.status === "verified") return "mot pour mot · vérifiée par le serveur";
    if (passage.status === "stale_version") return "vérifiée · sur une analyse antérieure";
    if (passage.status) return "introuvable à cet endroit";
    return "non vérifiée";
  };
  const shortVerdict = (passage) => {
    if (passage.status === "verified") return "vérifiée";
    if (passage.status === "stale_version") return "vérifiée · analyse antérieure";
    if (passage.status) return "introuvable";
    return "non vérifiée";
  };

  const root = document.getElementById("root");
  const state = { view: null, tab: "sources", item: 0 };
  // The loop's cap, set from each result rendered.
  let maxRounds = 0;

  const hopsOf = (view) => list(view && view.hops);
  const passagesOf = (view) => list(view && view.passages);
  const pageCount = (view) => Number(view.page_count) || 0;
  const onPage = (regions, page) => list(regions).filter((r) => Number(r.page) === page);
  const pagesIn = (regions) =>
    [...new Set(list(regions).map((r) => Number(r.page)))].filter(Number.isInteger).sort((a, b) => a - b);
  const pagesOf = (hop) => {
    const pages = pagesIn(hop.regions);
    if (!pages.length && Number.isInteger(Number(hop.page))) pages.push(Number(hop.page));
    return pages;
  };
  const pageSpan = (pages) =>
    !pages.length ? "" : pages.length === 1 ? num(pages[0]) : `${num(pages[0])}–${num(pages[pages.length - 1])}`;
  const quotesOf = (view, hop) => passagesOf(view).filter((p) => p.hop_id === hop.hop_id);
  const boxOf = (region) => list(region.box).map(Number);
  // The vertical extent of some boxes, as [top, bottom].
  const span = (regions) => {
    const boxes = regions.map(boxOf).filter((b) => b.length === 4 && b.every(Number.isFinite));
    return boxes.length ? [Math.min(...boxes.map((b) => b[1])), Math.max(...boxes.map((b) => b[3]))] : null;
  };
  const reach = (regions) => {
    const boxes = regions.map(boxOf).filter((b) => b.length === 4 && b.every(Number.isFinite));
    return boxes.length ? [Math.min(...boxes.map((b) => b[0])), Math.max(...boxes.map((b) => b[2]))] : null;
  };

  // ---- what the card shows: the passages quoted, one at a time ----------
  // In page order, so the strip reads left to right. An answer that quotes
  // nothing still shows where it read: its rounds stand in.

  function itemsOf(view) {
    const passages = passagesOf(view)
      .map((p) => {
        const marks = list(p.marks);
        const page = pagesIn(marks)[0] || pagesIn(p.regions)[0] || Number(p.page);
        return { kind: "passage", p, page };
      })
      .filter((item) => Number.isInteger(item.page) && item.page > 0);
    if (passages.length) {
      const top = (item) => (span(onPage(item.p.marks, item.page)) || span(onPage(item.p.regions, item.page)) || [0])[0];
      return passages.sort((a, b) => a.page - b.page || top(a) - top(b));
    }
    return hopsOf(view)
      .map((h) => ({ kind: "hop", h, page: pagesOf(h)[0] }))
      .filter((item) => Number.isInteger(item.page) && item.page > 0);
  }

  function render(view) {
    maxRounds = Number(view.totals && view.totals.max_rounds) || 0;
    const fresh = state.view !== view;
    state.view = view;
    state.items = itemsOf(view);
    if (fresh) state.item = 0;
    paint();
    hydrate();
  }

  function paint() {
    const view = state.view;
    if (!view) return;
    root.className = "card";
    root.innerHTML = head(view) + (state.tab === "details" ? details(view) : sources(view));
    place();
    reportSize();
  }

  // Only the window onto the page changes when a page lands.
  function paintSheet() {
    const sheet = root.querySelector("[data-sheet]");
    if (sheet && state.view) sheet.innerHTML = sheetInner(state.view);
    place();
    reportSize();
  }

  // ---- header ---------------------------------------------------------

  function head(view) {
    const tab = (id, label) =>
      `<button type="button" role="tab" data-tab="${id}" aria-selected="${state.tab === id}">${label}</button>`;
    const link = studioLink(view);
    const name = view.title || view.filename || view.document_id;
    return `<header class="head">
      <div class="doc">${ICON.doc}<span class="doc-title" title="${esc(view.filename)}">${esc(name)}</span></div>
      <div class="switch" role="tablist" aria-label="Vue de la carte">${tab("sources", "Sources")}${tab("details", "Détails")}</div>
      ${isLink(link) ? `<button type="button" class="studio" data-open="${esc(link)}"><span><span class="long">Ouvrir dans </span>Studio</span>${ICON.out}</button>` : ""}
    </header>`;
  }

  // The passage on show, else the first passage or round that has a link.
  function studioLink(view) {
    const item = (state.items || [])[state.item];
    const own = item && (item.kind === "passage" ? item.p.deep_link : item.h.deep_link);
    if (isLink(own)) return own;
    const any = [...passagesOf(view), ...hopsOf(view)].find((x) => isLink(x.deep_link));
    return any ? any.deep_link : "";
  }

  // ---- Sources ----------------------------------------------------------

  function sources(view) {
    const items = state.items;
    if (!items.length) {
      return `<div class="foot"><span class="loc">Aucune page à montrer pour ces sources.</span></div>`;
    }
    return `${strip(view, items)}
      <div class="frame"><div class="sheet" data-sheet>${sheetInner(view)}</div></div>
      ${foot(view, items)}`;
  }

  function strip(view, items) {
    const current = items[state.item];
    const read = new Set(hopsOf(view).flatMap(pagesOf));
    const picks = new Map();
    items.forEach((item) => picks.set(item.page, [...(picks.get(item.page) || []), item]));
    const last = Math.max(pageCount(view), ...read, ...picks.keys(), 1);
    // Every page its own thumbnail up to a few dozen; past that, each run of
    // pages nobody opened folds into one bar, and the strip stays one line.
    const fold = last > 24;
    const cells = [];
    let run = 0;
    const flush = (end) => {
      if (!run) return;
      cells.push(
        fold && run > 1
          ? `<span class="pg run" style="flex-grow: ${run}" title="pages ${num(end - run + 1)}–${num(end)}, pas ouvertes"></span>`
          : '<span class="pg"></span>'.repeat(run)
      );
      run = 0;
    };
    for (let page = 1; page <= last; page += 1) {
      if (picks.has(page)) {
        flush(page - 1);
        cells.push(pickButton(page, picks.get(page), current && current.page === page));
      } else if (read.has(page)) {
        flush(page - 1);
        cells.push('<span class="pg read" aria-hidden="true"></span>');
      } else {
        run += 1;
      }
    }
    flush(last);
    return `<div class="strip" aria-label="Pages du document">
      <span class="end">1</span>
      <div class="pages">${cells.join("")}</div>
      <span class="end">${num(last)}</span>
    </div>`;
  }

  // A page that holds what the card shows: its thumbnail marks where.
  function pickButton(page, items, pressed) {
    const marks = items
      .map((item) => {
        const own = item.kind === "passage" ? onPage(item.p.marks, page) : [];
        const blocks = item.kind === "passage" ? onPage(item.p.regions, page) : onPage(item.h.regions, page);
        const extent = span(own.length ? own : blocks);
        if (!extent) return "";
        const height = Math.max(0.07, extent[1] - extent[0]);
        const top = Math.min(extent[0], 1 - height);
        const bad = item.kind === "passage" && tone(item.p) === "bad" ? " bad" : "";
        return `<span class="mk${bad}" style="top: ${pct(top)}%; height: ${pct(height)}%"></span>`;
      })
      .join("");
    const what = items[0].kind === "passage" ? "le passage cité" : "la section lue";
    return `<button type="button" class="pick" data-pick="${page}" aria-pressed="${pressed}" aria-label="Voir ${what} en page ${num(page)}">
      <span class="thumb">${marks}</span><span class="pn">${num(page)}</span>
    </button>`;
  }

  function sheetInner(view) {
    const item = state.items[state.item];
    if (!item) return "";
    const cached = pages.get(item.page);
    const image = cached && cached.image;
    const folio = `<span class="folio">p. ${num(item.page)}</span>`;
    if (image) {
      return `<div class="window"><div class="leaf" data-leaf>
          <img alt="Page ${num(item.page)}, ${item.kind === "passage" ? "le passage cité surligné" : "la section lue encadrée"}" src="${esc(image.data_uri)}">
          ${highlights(view, item)}
        </div></div>${folio}`;
    }
    if (noServerTools || (cached && cached.error && !cached.retriable)) {
      return textOnly(item, noServerTools ? "" : cached.error) + folio;
    }
    const message = cached && cached.error ? cached.error : `Chargement de la page ${num(item.page)}…`;
    return `<span class="ph">${esc(message)}</span>${folio}`;
  }

  // On the page: the quote on show, line by line; the other quotes on the
  // same page fainter. A quote with no line found shows by its block.
  function highlights(view, item) {
    const page = item.page;
    const shown = [];
    const draw = (other) => (entry) => {
      if (entry.kind === "hop") {
        onPage(entry.h.regions, page).forEach((r) => shown.push(block(r, "read")));
        return;
      }
      const lines = onPage(entry.p.marks, page);
      const look = other ? " other" : tone(entry.p) === "bad" ? " bad" : "";
      if (lines.length) {
        lines.forEach((r) => shown.push(`<span class="hl${look}" style="${boxStyle(r, 0.003, 0.002)}"></span>`));
      } else if (!other) {
        onPage(entry.p.regions, page).forEach((r) => shown.push(block(r, tone(entry.p))));
      }
    };
    state.items.filter((x) => x !== item && x.page === page).forEach(draw(true));
    draw(false)(item);
    return shown.join("");
  }

  function block(region, look) {
    return `<span class="blk ${look}" style="${boxStyle(region, 0.006, 0.004)}"></span>`;
  }

  function boxStyle(region, padX, padY) {
    const [l, t, r, b] = boxOf(region);
    return `left: ${pct(l - padX)}%; top: ${pct(t - padY)}%; width: ${pct(r - l + 2 * padX)}%; height: ${pct(b - t + 2 * padY)}%`;
  }

  function textOnly(item, why) {
    const text =
      item.kind === "passage"
        ? item.p.quote
          ? `<span class="q">« <mark${tone(item.p) === "bad" ? ' class="bad"' : ""}>${esc(item.p.quote)}</mark> »</span>`
          : '<span class="q">Passage cité sans citation transmise.</span>'
        : `<span class="q">${esc(item.h.found || item.h.title)}</span>`;
    const note = why || "Cet hôte ne relaie pas les appels d’outils : pas d’aperçu de la page.";
    return `<div class="textonly">${text}<small>${esc(note)}</small></div>`;
  }

  function foot(view, items) {
    const item = items[state.item];
    const title =
      item.kind === "passage"
        ? item.p.section || (hopsOf(view).find((h) => h.hop_id === item.p.hop_id) || {}).title || ""
        : item.h.title;
    // "6.4 One size up" reads as a section number; a plain title stays plain.
    const loc = /^\d/.test(title) ? `§${title}` : title;
    const count = items.length > 1 ? `<span class="count">${num(state.item + 1)} / ${num(items.length)}</span>` : "";
    let mark;
    if (item.kind === "hop") {
      mark = `<span class="verdict">${ICON.dash}section lue</span>`;
    } else {
      const look = tone(item.p);
      const icon = look === "ok" ? ICON.check : look === "bad" ? ICON.cross : ICON.dash;
      mark = `<span class="verdict${look === "bad" ? " bad" : ""}" title="${esc(verdict(item.p))}">${icon}${esc(shortVerdict(item.p))}</span>`;
    }
    return `<div class="foot"><span class="loc" title="${esc(loc)}">${esc(loc)}</span><span class="state">${count}${mark}</span></div>`;
  }

  // ---- the window onto the page -------------------------------------------
  // The page is drawn at the width that sets the passage's column across the
  // window, capped so a narrow column is not blown up; then slid so the
  // quote sits in the middle of the window, never past the page's edges.

  const ZOOM_CAP = 1.5;
  const DEFAULT_ASPECT = 1.294;

  function geometry(item, width, height, aspect) {
    const page = item.page;
    const own = item.kind === "passage" ? onPage(item.p.marks, page) : [];
    const blocks = onPage(item.kind === "passage" ? item.p.regions : item.h.regions, page);
    const column = reach(blocks.length ? blocks : own) || [0.08, 0.92];
    const focus = span(own.length ? own : blocks) || [0.4, 0.6];
    const pad = Math.min(34, width * 0.06);
    const wide = Math.max(0.05, column[1] - column[0]);
    const scale = Math.min((width - 2 * pad) / wide, width * ZOOM_CAP);
    const tall = scale * aspect;
    let x = (width - wide * scale) / 2 - column[0] * scale;
    x = scale >= width ? Math.min(0, Math.max(width - scale, x)) : (width - scale) / 2;
    const reachTall = (focus[1] - focus[0]) * tall;
    let y = reachTall > height - 68 ? 34 - focus[0] * tall : height / 2 - ((focus[0] + focus[1]) / 2) * tall;
    y = tall >= height ? Math.min(0, Math.max(height - tall, y)) : (height - tall) / 2;
    return { x, y, scale, tall };
  }

  function place() {
    const sheet = root.querySelector("[data-sheet]");
    const item = state.items && state.items[state.item];
    if (!sheet || !item) return;
    const width = sheet.clientWidth;
    const height = sheet.clientHeight;
    if (!width || !height) return;
    const cached = pages.get(item.page);
    const image = cached && cached.image;
    const aspect = image ? Number(image.height) / Number(image.width) || DEFAULT_ASPECT : DEFAULT_ASPECT;
    const g = geometry(item, width, height, aspect);
    state.want = Math.min(1600, Math.ceil(g.scale * (window.devicePixelRatio || 1)));
    const leaf = sheet.querySelector("[data-leaf]");
    if (leaf) leaf.style.cssText = `left: ${px(g.x)}px; top: ${px(g.y)}px; width: ${px(g.scale)}px; height: ${px(g.tall)}px`;
  }

  // ---- Détails ----------------------------------------------------------

  function details(view) {
    const totals = view.totals || {};
    const hops = hopsOf(view);
    const passages = passagesOf(view);
    const rounds = Number(totals.rounds) || 0;
    const ok = passages.filter((p) => tone(p) === "ok").length;
    const noun = totals.mode === "pages" ? "page" : "section";
    const over = totals.over_cap === true;
    const slots = Math.max(maxRounds, rounds);
    const roundPips = Array.from({ length: slots }, (_, i) =>
      `<span class="${i >= rounds ? "" : i < maxRounds ? "on" : "over"}"></span>`
    ).join("");
    const quotePips = passages.map((p) => `<span class="${tone(p)}"></span>`).join("");
    const share = `${pct(Number(totals.percent) / 100)}%`;
    const unknown = list(view.unknown);
    return `<div class="details">
      <div class="ask"><span class="kicker">Question</span><p class="question">${esc(view.question)}</p></div>
      <div class="tiles">
        <div class="tile"><span class="kicker">Document lu</span>
          <span class="tile-value">${fr(totals.percent, 1)} %</span>
          <span class="meter"><span style="width: ${share}"></span></span>
          <span class="tile-sub">${num(totals.sections_read)} ${plural(totals.sections_read, noun)} sur ${num(totals.sections_total)}</span></div>
        <div class="tile"><span class="kicker">Tours</span>
          <span class="tile-value${over ? " over" : ""}">${num(rounds)} <small>/ ${num(maxRounds)}</small></span>
          <span class="pips">${roundPips}</span>
          <span class="tile-sub${over ? " over" : ""}">${over ? "plafond dépassé" : `une ${noun} par tour`}</span></div>
        <div class="tile"><span class="kicker">Tokens lus</span>
          <span class="tile-value">${num(totals.tokens_read)}</span>
          <span class="meter"><span style="width: ${share}"></span></span>
          <span class="tile-sub">sur ${num(totals.tokens_total)} au total</span></div>
        <div class="tile"><span class="kicker">Citations</span>
          <span class="tile-value${passages.length && ok === passages.length ? " ok" : ""}">${num(ok)} <small>/ ${num(passages.length)}</small></span>
          <span class="pips">${quotePips || "<span></span>"}</span>
          <span class="tile-sub">vérifiées mot pour mot</span></div>
      </div>
      ${coverage(view, noun)}
      ${roundsTable(view, hops, totals, noun)}
      ${quotesList(view)}
      ${unknown.length ? `<p class="tally">${num(unknown.length)} ${plural(unknown.length, "ancre")} ${plural(unknown.length, "introuvable")}, non ${plural(unknown.length, "affichée")}.</p>` : ""}
      <div class="meta">
        <span class="mono">analyse ${esc(view.version_id)} · ancres dstudio:// résolues par le serveur</span>
        <span class="caveat">Pages, tokens et citations viennent du serveur. Les « pourquoi » et « trouvé » sont les mots de l’agent.</span>
      </div>
    </div>`;
  }

  // The whole document, one segment per section as wide as its own text; a
  // bracket under the run the agent read.
  function coverage(view, noun) {
    const segments = list(view.segments);
    if (!segments.length) return "";
    const total = segments.reduce((sum, s) => sum + (Number(s.tokens) || 0), 0) || 1;
    const lit = segments.map((s) => s.status === "read" || s.status === "cited");
    const first = lit.indexOf(true);
    const last = lit.lastIndexOf(true);
    const before = (i) => segments.slice(0, i).reduce((sum, s) => sum + (Number(s.tokens) || 0), 0) / total;
    const litCount = lit.filter(Boolean).length;
    const bracket =
      first < 0
        ? ""
        : `<span class="bracket" style="left: ${pct(before(first))}%; width: ${pct(before(last + 1) - before(first))}%"></span>
           <span class="bracket-label" style="left: ${pct((before(first) + before(last + 1)) / 2)}%">${num(litCount)} ${plural(litCount, noun)} ${plural(litCount, "lue")}</span>`;
    const segs = segments
      .map(
        (s) =>
          `<span class="seg" data-status="${esc(s.status)}" style="flex-grow: ${Number(s.tokens) || 0}" title="${esc(s.title)}"></span>`
      )
      .join("");
    const count = pageCount(view);
    return `<div>
      <div class="section-head"><span class="kicker">Ce que l’agent a lu du document</span>
        <span class="mono">${num(segments.length)} ${plural(segments.length, noun)}${count ? ` · ${num(count)} ${plural(count, "page")}` : ""} · largeur = tokens</span></div>
      <div class="coverage">
        <div class="segments" role="img" aria-label="Le document entier, ${noun} par ${noun}, celles que l’agent a lues en couleur">${segs}</div>
        ${bracket}
        <span class="end-label">début</span><span class="end-label right">fin</span>
      </div>
      <div class="keys"><span><i class="cited"></i>Lue et citée</span><span><i class="read"></i>Lue</span><span><i></i>Pas ouverte</span></div>
    </div>`;
  }

  function badge(hop) {
    const over = maxRounds > 0 && Number(hop.ordinal) > maxRounds;
    return `<span class="num${over ? " over" : ""}">${num(hop.ordinal)}</span>`;
  }

  function roundFlag(view, hop) {
    const quotes = quotesOf(view, hop);
    if (quotes.some((p) => tone(p) === "bad")) return '<span class="flag bad">introuvable</span>';
    if (quotes.some((p) => tone(p) === "ok")) return '<span class="flag ok">cité</span>';
    return quotes.length ? '<span class="flag">cité</span>' : '<span class="flag">lu</span>';
  }

  function roundsTable(view, hops, totals, noun) {
    const widest = Math.max(1, ...hops.map((hop) => Number(hop.est_tokens) || 0));
    const rows = hops
      .map(
        (hop) => `<div class="tr">
          ${badge(hop)}
          <span class="what">
            <span class="t">${esc(hop.title)}</span>
            ${hop.why ? `<span class="why"><b>Pourquoi</b> · ${esc(hop.why)}</span>` : ""}
            ${hop.found ? `<span class="found"><b>Trouvé</b> · ${esc(hop.found)}</span>` : ""}
          </span>
          <span class="m">${pageSpan(pagesOf(hop))}</span>
          <span class="cost"><span class="track"><span style="width: ${pct((Number(hop.est_tokens) || 0) / widest)}%"></span></span><span class="m">${num(hop.est_tokens)}</span></span>
          ${roundFlag(view, hop)}
        </div>`
      )
      .join("");
    const left = Math.max(0, maxRounds - hops.length);
    const unused = left
      ? `<div class="tr unused"><span class="num ghost">${left === 1 ? num(hops.length + 1) : "+" + num(left)}</span><span class="what">${left === 1 ? "Tour non utilisé" : `Tours non utilisés : ${num(left)}`}</span><span></span><span class="cost"></span><span></span></div>`
      : "";
    const allPages = [...new Set(hops.flatMap(pagesOf))].sort((a, b) => a - b);
    const cited = passagesOf(view).length;
    const over = totals.over_cap === true;
    return `<div>
      <div class="section-head"><span class="kicker">Tours de lecture</span>
        <span class="mono">${num(hops.length)} / ${num(maxRounds)}${over ? " · plafond dépassé" : ""}</span></div>
      <div class="rounds">
        <div class="tr th"><span>Tour</span><span>${noun === "page" ? "Page" : "Section"}</span><span>Pages</span><span class="cost">Tokens lus</span><span style="justify-self: end">Statut</span></div>
        ${rows}${unused}
        <div class="tr total"><span></span><span class="t">${num(totals.sections_read)} ${plural(totals.sections_read, noun)} ${plural(totals.sections_read, "lue")}</span>
          <span class="m">${pageSpan(allPages)}</span>
          <span class="cost"><span class="track" style="visibility: hidden"></span><span class="m">${num(totals.tokens_read)}</span></span>
          <span class="m" style="justify-self: end">${num(cited)} ${plural(cited, "cité")}</span></div>
      </div>
    </div>`;
  }

  // Every quote, with the server's word on it; one click shows it on its page.
  function quotesList(view) {
    const items = state.items.filter((item) => item.kind === "passage");
    if (!items.length) return "";
    const rows = items
      .map((item) => {
        const passage = item.p;
        const look = tone(passage);
        const text = passage.quote
          ? `<span class="q">« ${esc(passage.quote)} »</span>`
          : '<span class="q none">Passage cité sans citation transmise.</span>';
        const flag = `<span class="flag ${look === "unchecked" ? "" : look}">${esc(shortVerdict(passage))}</span>`;
        return `<button type="button" class="quote" data-item="${state.items.indexOf(item)}">
          ${text}${flag}
          <span class="where"><span>${esc(passage.section)}</span><span class="mono">p. ${num(item.page)}</span></span>
        </button>`;
      })
      .join("");
    return `<div><div class="section-head"><span class="kicker">Citations</span></div><div class="quotes">${rows}</div></div>`;
  }

  // ---- interaction --------------------------------------------------------
  // One listener on the card: the markup is rebuilt on every change, and a
  // listener per element would have to be rebuilt with it.

  root.addEventListener("click", (event) => {
    const target = event.target.closest("button");
    if (!target || !root.contains(target) || target.disabled) return;
    const { tab, pick, item, open } = target.dataset;
    if (tab) {
      state.tab = tab === "details" ? "details" : "sources";
      paint();
      if (state.tab === "sources") ensureShown();
    } else if (pick) {
      choosePage(Number(pick));
    } else if (item) {
      show(Number(item));
    } else if (open) {
      // The host's job: an app cannot navigate the user by itself, and hosts
      // gate this behind their own confirmation.
      post({ jsonrpc: "2.0", id: Date.now(), method: "ui/open-link", params: { url: open } });
    }
  });

  // A page picked again cycles through the quotes it holds.
  function choosePage(page) {
    const items = state.items;
    const here = items.map((item, i) => (item.page === page ? i : -1)).filter((i) => i >= 0);
    if (!here.length) return;
    const at = here.indexOf(state.item);
    show(at >= 0 ? here[(at + 1) % here.length] : here[0]);
  }

  function show(index) {
    if (!Number.isInteger(index) || !state.items[index]) return;
    state.item = index;
    state.tab = "sources";
    paint();
    ensureShown();
  }

  // ---- pages ------------------------------------------------------------
  // Fetched through the card's own app-only tool, at the width the window
  // draws them at, and remembered: going back costs nothing. A page drawn
  // wider than it was asked for is asked for again, sharper — but never again
  // at a width already asked: the server may cap what it renders. A local
  // timeout is worth retrying; a server refusal stays refused.

  const pages = new Map();
  const inflight = new Set();
  let noServerTools = false;

  function anchorUri(view) {
    const hop = hopsOf(view)[0];
    const passage = passagesOf(view)[0];
    return (hop && hop.uri) || (passage && passage.uri) || "";
  }

  async function hydrate() {
    const negotiated = await handshake();
    if (negotiated && host.capabilities && !host.capabilities.serverTools) noServerTools = true;
    if (noServerTools) {
      paintSheet();
      return;
    }
    await ensureShown();
    // Then the other pages the strip offers, so a click lands at once.
    for (const page of [...new Set(state.items.map((item) => item.page))]) await ensure(page, state.want);
  }

  function ensureShown() {
    const item = state.items && state.items[state.item];
    return item ? ensure(item.page, state.want) : Promise.resolve();
  }

  async function ensure(page, want) {
    if (noServerTools || !state.view || inflight.has(page)) return;
    const width = Math.max(320, Math.min(1600, Number(want) || 900));
    const cached = pages.get(page);
    if (cached && cached.image && Number(cached.asked) >= width * 0.85) return;
    if (cached && cached.error && !cached.retriable) return;
    const uri = anchorUri(state.view);
    if (!uri) return;
    inflight.add(page);
    try {
      pages.set(page, { image: await fetchPage(uri, page, width), asked: width });
    } catch (error) {
      // A sharper copy that failed keeps the one already there.
      if (!(cached && cached.image)) {
        pages.set(page, {
          error: error.message || "pas d’aperçu",
          retriable: error.message === TIMEOUT_MESSAGE,
        });
      }
    } finally {
      inflight.delete(page);
    }
    const item = state.items && state.items[state.item];
    if (state.tab === "sources" && item && item.page === page) paintSheet();
  }

  async function fetchPage(uri, page, maxWidth) {
    // A generous budget: the first fetch of a page can pay for the whole
    // document to be rasterized, and a premature timeout would cache a
    // failure the server never produced.
    const result = await call(
      "tools/call",
      { name: "get_source_page", arguments: { uri, max_width: maxWidth, page } },
      20000
    );
    if (result && (result.isError || result.is_error)) {
      throw new Error(result?.content?.[0]?.text || "le serveur a refusé");
    }
    const image =
      result?.structuredContent ??
      result?.structured_content ??
      JSON.parse(result?.content?.[0]?.text ?? "{}");
    if (!image || !image.data_uri || !image.width || !image.height) {
      throw new Error("la réponse ne contenait pas d’image");
    }
    return image;
  }

  function post(message) {
    try { window.parent?.postMessage(message, "*"); } catch (_) { /* no host, no-op */ }
  }

  // ---- the bridge ------------------------------------------------------
  // JSON-RPC 2.0 over postMessage, as the MCP Apps spec defines it. The
  // card renders from the tool result alone; the only fetches are the
  // handshake and `get_source_page` — the pages the quotes sit on, at the
  // width they are drawn.

  const pending = new Map();
  let nextRequestId = 1;
  // Named so the page cache can tell a local timeout — worth retrying —
  // from an answer the server actually gave.
  const TIMEOUT_MESSAGE = "l’hôte n’a pas répondu";

  function call(method, params, timeoutMs = 8000) {
    return new Promise((resolve, reject) => {
      const id = `app-${nextRequestId++}`;
      const timer = setTimeout(() => {
        pending.delete(id);
        reject(new Error(TIMEOUT_MESSAGE));
      }, timeoutMs);
      pending.set(id, { resolve, reject, timer });
      post({ jsonrpc: "2.0", id, method, params });
    });
  }

  function settle(data) {
    const entry = data && data.id != null && pending.get(data.id);
    if (!entry) return false;
    pending.delete(data.id);
    clearTimeout(entry.timer);
    if (data.error) entry.reject(new Error(data.error.message || "call failed"));
    else entry.resolve(data.result);
    return true;
  }

  // ---- handshake -------------------------------------------------------
  // `ui/initialize`, then `ui/notifications/initialized` once the host has
  // answered. The notification is what allows the host to push the tool
  // result at all, so it is sent even when the request fails — withholding it
  // on a host that predates the handshake would trade a theme for a blank
  // card. The answer carries the frame to fit.
  const PROTOCOL_VERSION = "2026-01-26";
  const HANDSHAKE_MS = 2500;
  let host = { capabilities: null, context: {} };
  let ready = null;

  function handshake() {
    if (ready) return ready;
    ready = call(
      "ui/initialize",
      {
        protocolVersion: PROTOCOL_VERSION,
        capabilities: {},
        appInfo: { name: "docling-studio-sources", version: "4" },
        appCapabilities: { availableDisplayModes: ["inline"] },
      },
      HANDSHAKE_MS
    )
      .then((result) => {
        host = {
          capabilities: result?.hostCapabilities ?? null,
          context: result?.hostContext ?? {},
        };
        applyHostContext(host.context);
        return true;
      })
      .catch(() => false)
      .then((negotiated) => {
        post({ jsonrpc: "2.0", method: "ui/notifications/initialized", params: {} });
        return negotiated;
      });
    return ready;
  }

  function applyHostContext(context) {
    if (!context || typeof context !== "object") return;
    applyContainerDimensions(context.containerDimensions);
    reportSize();
  }

  // The host owns the frame. A fixed `width` means "fill exactly this"; a
  // `maxWidth` means "grow up to here". `100%` rather than the spec snippet's
  // `100vw`, which counts the scrollbar gutter the client width does not.
  let frame = null;
  function applyContainerDimensions(dimensions) {
    if (!dimensions || typeof dimensions !== "object") return;
    frame = dimensions;
    const style = document.documentElement.style;
    if (typeof dimensions.width === "number") {
      style.width = "100%";
      style.maxWidth = "100%";
    } else if (typeof dimensions.maxWidth === "number") {
      style.maxWidth = `${dimensions.maxWidth}px`;
    }
    if (typeof dimensions.height === "number") style.height = "100%";
    else if (typeof dimensions.maxHeight === "number") {
      style.maxHeight = `${dimensions.maxHeight}px`;
    }
  }

  let lastHeight = 0;
  let lastWidth = 0;
  function reportSize() {
    const main = document.querySelector("main");
    if (!main) return;
    const height = Math.ceil(main.getBoundingClientRect().height);
    // Clamped to what the host declared: asking for more than it offered is
    // asking to be cropped.
    const ceiling =
      typeof frame?.width === "number"
        ? frame.width
        : typeof frame?.maxWidth === "number"
          ? frame.maxWidth
          : Infinity;
    const width = Math.ceil(Math.min(document.documentElement.clientWidth, ceiling));
    if (!height) return;
    if (Math.abs(height - lastHeight) < 8 && width === lastWidth) return;
    lastHeight = height;
    lastWidth = width;
    post({
      jsonrpc: "2.0",
      method: "ui/notifications/size-changed",
      params: { width, height },
    });
  }

  // A new width moves the window onto the page as well as the card's height.
  if (typeof ResizeObserver === "function") {
    new ResizeObserver(() => {
      place();
      reportSize();
    }).observe(document.querySelector("main"));
  }

  // Host -> app. Hosts differ in how much of the JSON-RPC envelope reaches
  // the guest, so the payload is dug out of every documented shape rather
  // than betting on one: params.result / result / the message itself,
  // structured content first, then the JSON in the text content block.
  function extract(data) {
    if (!data || typeof data !== "object") return null;
    for (const candidate of [data.params?.result, data.params, data.result, data]) {
      if (!candidate || typeof candidate !== "object") continue;
      const structured = candidate.structuredContent ?? candidate.structured_content;
      if (structured?.hops && structured.totals) return structured;
      if (candidate.hops && candidate.totals) return candidate;
      const text = candidate.content?.[0]?.text;
      if (typeof text === "string") {
        try {
          const parsed = JSON.parse(text);
          if (parsed?.hops && parsed.totals) return parsed;
        } catch (_) { /* not our payload */ }
      }
    }
    return null;
  }

  window.addEventListener("message", (event) => {
    // Only the host frame speaks for the host. Another app on the same page
    // can reach this window too, and would otherwise be rendered as a record
    // or answer this view's own calls.
    if (event.source !== window.parent) return;
    const data = event.data;
    if (settle(data)) return;

    // The host asks before tearing the view down and waits for the answer.
    if (data?.method === "ui/resource-teardown") {
      if (data.id != null) post({ jsonrpc: "2.0", id: data.id, result: {} });
      return;
    }
    if (data?.method === "ui/notifications/host-context-changed") {
      host = { ...host, context: { ...host.context, ...(data.params || {}) } };
      applyHostContext(host.context);
      return;
    }

    // A refused or cancelled call has nothing to show: say so rather than
    // leave the card waiting.
    if (data?.method === "ui/notifications/tool-cancelled") {
      showState("L’appel a été annulé.");
      return;
    }
    if (data?.method === "ui/notifications/tool-result" && data.params?.isError) {
      showState(`L’appel a échoué : ${data.params.content?.[0]?.text || "sans détail"}`);
      return;
    }
    const view = extract(data);
    if (view) render(view);
    else if (data?.method === "ui/notifications/tool-result") {
      showState("Le résultat ne contient aucune source à montrer.");
    }
  });

  function showState(message) {
    root.className = "fallback";
    root.textContent = message;
    reportSize();
  }

  handshake();
</script>
</body>
</html>
