<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sources</title>
<style>
  /* Light only, on purpose (#363): the cards are read off a projector, and a
     host in dark mode still gets the same high-contrast card. Tokens follow
     the Studio palette; the accent is the deep orange a cited source wears. */
  :root {
    color-scheme: light;
    --bg: #fafafa;
    --bg-surface: #ffffff;
    --bg-elevated: #f4f4f5;
    --bg-hover: #e4e4e7;
    --accent: #c2410c;
    --accent-muted: rgba(194, 65, 12, 0.16);
    --read: #fdba74;
    --read-bg: #fff7ed;
    --read-border: #fb923c;
    --read-ink: #7c2d12;
    --unread: #e4e4e7;
    --text: #111113;
    --text-secondary: #3f3f46;
    --text-muted: #52525b;
    --text-faint: #71717a;
    --border: #e4e4e7;
    --border-light: #d4d4d8;
    --ok: #15803d;
    --bad: #b91c1c;
    --radius: 10px;
    --radius-sm: 6px;
    --radius-lg: 16px;
    --sans: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
    --display: 'Inter Tight', 'Inter', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
    --mono: 'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { max-width: 100%; }

  body {
    font-family: var(--sans);
    background: transparent;
    color: var(--text);
    font-size: 15px;
    line-height: 1.45;
    -webkit-font-smoothing: antialiased;
  }

  /* The card measures itself against `main`, never against the window: the
     host owns the frame width, and a viewport media query asked inside an
     iframe answers a question about the frame, not about the card. */
  main {
    max-width: 940px;
    margin: 0 auto;
    padding: clamp(6px, 2.5vw, 14px);
    container-type: inline-size;
  }

  .card {
    min-width: 0;
    background: var(--bg-surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    overflow: hidden;
  }

  /* ---- header ------------------------------------------------------- */

  .head { padding: 22px 26px 14px; }
  .eyebrow-row { display: flex; justify-content: space-between; align-items: baseline; gap: 14px; }
  .eyebrow {
    flex: none;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--text-muted);
  }
  .doc {
    min-width: 0;
    font-size: 12.5px;
    font-weight: 600;
    color: var(--text-muted);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .question {
    margin-top: 8px;
    font-size: 22px;
    font-weight: 600;
    line-height: 1.25;
    letter-spacing: -0.01em;
    overflow-wrap: anywhere;
  }

  /* ---- summary ------------------------------------------------------ */
  /* How much of the document the answer needed, the rounds against the cap,
     and where in the document they went — one band, above the rounds. */

  .summary {
    padding: 2px 26px 18px;
    display: grid;
    grid-template-columns: minmax(0, 1fr) auto;
    align-items: end;
    gap: 14px 20px;
    border-bottom: 1px solid var(--border);
  }
  .share { display: flex; align-items: flex-end; gap: 14px; min-width: 0; }
  .pct {
    font-family: var(--display);
    font-size: 48px;
    font-weight: 800;
    line-height: 0.9;
    letter-spacing: -0.03em;
    color: var(--accent);
    white-space: nowrap;
  }
  .share-label { display: grid; gap: 2px; padding-bottom: 2px; min-width: 0; }
  .share-label b { font-size: 17px; font-weight: 700; }
  .share-label span { font-size: 14px; color: var(--text-muted); }
  .gauge { display: grid; justify-items: end; gap: 6px; padding-bottom: 2px; }
  .pips { display: flex; gap: 5px; }
  .pip { width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--text-faint); }
  .pip.on { background: var(--accent); border-color: var(--accent); }
  .pip.over { background: var(--bad); border-color: var(--bad); }
  .gauge-label { font-size: 14px; font-weight: 600; }
  /* Past the round cap: said in the line itself, coloured so it is seen. */
  .gauge-label.over { color: var(--bad); }
  /* The whole document, one segment per section, each as wide as its own
     text: the lit ones are all the answer needed. */
  .minimap { grid-column: 1 / -1; display: flex; height: 12px; border-radius: 999px; overflow: hidden; }
  .seg { flex-basis: 0; min-width: 0; background: var(--unread); box-shadow: inset -1px 0 0 var(--bg-surface); }
  .seg[data-status="read"] { background: var(--read); }
  .seg[data-status="cited"] { background: var(--accent); }

  /* ---- rounds --------------------------------------------------------- */
  /* One row per round: its page, the passage boxed, beside what the agent
     went looking for and what it found. */

  .rounds { list-style: none; padding: 4px 26px 2px; }
  .hop {
    display: grid;
    grid-template-columns: 128px minmax(0, 1fr);
    gap: 18px;
    align-items: start;
    padding: 16px 0;
    border-bottom: 1px solid var(--border);
  }
  .hop:last-child { border-bottom: 0; }
  @container (max-width: 480px) {
    .hop { grid-template-columns: 96px minmax(0, 1fr); gap: 12px; }
  }
  .round-body { display: grid; gap: 5px; min-width: 0; }
  .round-kicker {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 12px;
    font-weight: 800;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--text-muted);
  }
  .badge {
    flex: none;
    width: 26px;
    height: 26px;
    border-radius: 50%;
    display: grid;
    place-items: center;
    font-size: 13px;
    font-weight: 800;
    letter-spacing: 0;
    background: var(--read-bg);
    color: var(--read-ink);
    border: 2px solid var(--read-border);
  }
  .badge.cited { background: var(--accent); color: #fff; border-color: var(--accent); }
  .cited-tag { color: var(--accent); }
  .hop-where { font-size: 18px; font-weight: 700; line-height: 1.25; overflow-wrap: anywhere; }
  .hop-where .page { color: var(--text-muted); font-weight: 500; }
  .round-why { font-size: 14px; color: var(--text-muted); overflow-wrap: anywhere; }
  .round-found { font-size: 16px; line-height: 1.4; color: var(--text); overflow-wrap: anywhere; }
  .round-why b, .round-found b { font-weight: 700; color: var(--text-secondary); margin-right: 4px; }
  .open-link {
    justify-self: start;
    margin-top: 2px;
    font: inherit;
    font-size: 13px;
    font-weight: 700;
    color: var(--accent);
    background: none;
    border: 0;
    padding: 0;
    cursor: pointer;
  }
  .open-link:hover { text-decoration: underline; }
  .spare { padding: 0 26px 14px; font-size: 13px; color: var(--text-faint); }

  .hop .shot {
    position: relative;
    display: block;
    width: 100%;
    padding: 0;
    border: 2px solid var(--border);
    border-radius: var(--radius-sm);
    background: var(--bg-elevated);
    overflow: hidden;
    cursor: zoom-in;
  }
  .shot.pending, .shot.none, .shot.failed { height: 180px; }
  .hop[data-state="cited"] .shot { border: 3px solid var(--accent); }
  .shot img { display: block; width: 100%; height: auto; }
  .shot .mark { position: absolute; border: 2px solid var(--accent); background: var(--accent-muted); border-radius: 2px; min-height: 6px; }
  .hop[data-state="read"] .shot .mark { border-color: var(--read-border); background: rgba(251, 146, 60, 0.22); }
  .shot .ph {
    position: absolute;
    inset: 0;
    display: grid;
    place-items: center;
    padding: 8px;
    font-size: 11px;
    text-align: center;
    color: var(--text-faint);
  }
  .shot .glass {
    position: absolute;
    right: 5px;
    bottom: 5px;
    width: 24px;
    height: 24px;
    border-radius: 50%;
    display: grid;
    place-items: center;
    font-size: 12px;
    color: #fff;
    background: rgba(17, 17, 19, 0.72);
    opacity: 0;
    transition: opacity 0.12s ease;
  }
  .hop .shot:hover .glass,
  .hop .shot:focus-visible .glass { opacity: 1; }
  .hop .shot:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  /* ---- the enlarged page ---------------------------------------------- */
  /* Same shape as the citation view's lens: on <body>, not inside <main>,
     because an overlay meant to fill the frame must not inherit the card's
     layout. The thumbnail stands in, upscaled, while the readable render is
     on its way — the same page, marker already in place. */
  .lens {
    position: fixed;
    inset: 0;
    z-index: 50;
    display: grid;
    grid-template-rows: auto minmax(0, 1fr);
    gap: 10px;
    padding: 14px;
    background: color-mix(in srgb, var(--bg) 88%, #000);
  }
  .lens[hidden] { display: none; }
  .lens-bar { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .lens-title { font-family: var(--mono); font-size: 12px; color: var(--text-secondary); }
  .lens-title b { color: var(--accent); font-weight: 600; }
  .lens-bar button {
    font: inherit;
    font-size: 12.5px;
    padding: 4px 12px;
    border-radius: var(--radius-sm);
    border: 1px solid var(--border-light);
    background: var(--bg-surface);
    color: var(--text);
    cursor: pointer;
  }
  .lens-bar button:hover { border-color: var(--accent); color: var(--accent); }
  .lens-bar button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .lens-bar button:disabled { opacity: 0.4; cursor: default; }
  .lens-bar button:disabled:hover { border-color: var(--border-light); color: var(--text); }
  .lens-tools { margin-left: auto; display: flex; gap: 6px; }
  .lens-stage { display: grid; place-items: center; min-height: 0; overflow: auto; }
  .lens-page {
    position: relative;
    line-height: 0;
    background: #fff;
    border-radius: var(--radius-sm);
    overflow: hidden;
    box-shadow: 0 12px 44px rgba(0, 0, 0, 0.34);
  }
  .lens-page img { display: block; max-width: 100%; height: auto; }
  .lens-page.provisional img { filter: blur(0.4px); }
  .lens-page .mark {
    position: absolute;
    border: 1.5px solid var(--accent);
    background: var(--accent-muted);
    border-radius: 2px;
  }

  /* ---- footer -------------------------------------------------------- */

  .foot {
    border-top: 1px solid var(--border);
    padding: 16px 26px 18px;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }
  .cited-note { display: flex; align-items: center; gap: 8px; font-size: 15px; font-weight: 600; }
  .cited-note svg { flex: none; }
  .open-btn {
    font: inherit;
    font-size: 15px;
    font-weight: 700;
    color: #fff;
    background: var(--text);
    border: 0;
    border-radius: var(--radius);
    padding: 12px 18px;
    min-height: 44px;
    cursor: pointer;
  }
  .open-btn:hover { background: #27272a; }
  .open-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .tally { flex-basis: 100%; font-size: 12.5px; color: var(--bad); }
  /* Said once, plainly, on the artefact itself: the `why` and `found` lines
     are the agent's words; everything else is the server's. */
  .caveat { flex-basis: 100%; font-size: 12px; line-height: 1.5; color: var(--text-faint); }

  .empty { font-size: 13px; color: var(--text-faint); font-style: italic; }
  .fallback { padding: 18px; font-size: 13px; color: var(--text-secondary); }
</style>
</head>
<body>
<main>
  <div class="fallback" id="root">Waiting for the sources…</div>
</main>
<script>
  "use strict";

  // Every interpolation of model- or document-derived text goes through this
  // before it becomes markup. The server already defuses the content-wrapper
  // delimiter on its way out; this is the second half of the same promise,
  // because a thought is a string a model wrote after reading a PDF.
  const esc = (value) =>
    String(value ?? "")
      .replaceAll("&", "&amp;")
      .replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;")
      .replaceAll('"', "&quot;")
      .replaceAll("'", "&#39;");

  // Coerced first, because the result lands in markup unescaped.
  const num = (value) => {
    const number = Number(value);
    return Number.isFinite(number)
      ? String(number).replace(/\B(?=(\d{3})+(?!\d))/g, " ")
      : "—";
  };
  const short = (id) => (id && id.length > 12 ? id.slice(0, 8) + "…" : id || "—");

  // A round the answer quotes from is a source; one read without a quote is
  // context. Two states, both earned by the server resolving the anchors.
  const hopState = (hop) => ((hop.cited || []).length ? "cited" : "read");
  const isLink = (url) => /^https?:\/\//i.test(String(url || ""));
  // French figures for a French stage: 9,4 — coerced first, because the
  // result lands in markup unescaped.
  const fr = (value, digits = 0) => {
    const number = Number(value);
    return Number.isFinite(number)
      ? number.toLocaleString("fr-FR", { maximumFractionDigits: digits })
      : "—";
  };
  const CHECK =
    '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#15803d" ' +
    'stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' +
    '<path d="M20 6 9 17l-5-5"></path></svg>';

  const root = document.getElementById("root");

  // The loop's cap, set from each result rendered.
  let maxRounds = 0;

  function render(view) {
    const hops = Array.isArray(view.hops) ? view.hops : [];
    const segments = Array.isArray(view.segments) ? view.segments : [];
    const unknown = Array.isArray(view.unknown) ? view.unknown : [];
    const totals = view.totals || {};
    maxRounds = Number(totals.max_rounds) || 0;
    const cited = hops.reduce((count, hop) => count + (hop.cited || []).length, 0);
    const linked =
      hops.find((hop) => (hop.cited || []).length && isLink(hop.deep_link)) ||
      hops.find((hop) => isLink(hop.deep_link));
    const link = linked ? linked.deep_link : "";
    const spare = Math.max(0, maxRounds - hops.length);

    root.className = "card";
    root.innerHTML = `
      <div class="head">
        <div class="eyebrow-row">
          <span class="eyebrow">Sources de la réponse</span>
          <span class="doc">${esc(view.filename || view.document_id)}</span>
        </div>
        <div class="question">${esc(view.question)}</div>
      </div>
      ${summary(totals, segments)}
      ${hops.length ? `<ol class="rounds">${hops.map(roundRow).join("")}</ol>` : '<p class="spare">Aucune section lue.</p>'}
      ${hops.length && spare ? `<p class="spare">${spareLabel(hops.length, spare)}</p>` : ""}
      <div class="foot">
        <span class="cited-note">${CHECK}${num(cited)} passage${cited === 1 ? "" : "s"} cité${cited === 1 ? "" : "s"} dans la réponse</span>
        ${isLink(link) ? `<button type="button" class="open-btn" data-open="${esc(link)}">Ouvrir dans Docling Studio</button>` : ""}
        ${unknown.length ? `<p class="tally">${num(unknown.length)} ancre${unknown.length === 1 ? "" : "s"} introuvable${unknown.length === 1 ? "" : "s"}, non affichée${unknown.length === 1 ? "" : "s"}.</p>` : ""}
        <p class="caveat">Les « pourquoi » et « trouvé » sont les mots de l’agent. Les sections, les pages et la part du document lue viennent du serveur, qui résout les ancres lues et citées.</p>
      </div>`;

    wire();
    hydratePath();
  }

  // ---- summary ---------------------------------------------------------

  function summary(totals, segments) {
    const rounds = Number(totals.rounds) || 0;
    const over = totals.over_cap === true;
    const slots = Math.max(maxRounds, rounds);
    const pips = Array.from({ length: slots }, (_, i) => {
      const state = i >= rounds ? "off" : i < maxRounds ? "on" : "over";
      return `<span class="pip ${state}"></span>`;
    }).join("");
    const read = Number(totals.sections_read) || 0;
    const noun = totals.mode === "pages" ? "page" : "section";
    const label = over
      ? `${num(rounds)} tours, plafond de ${num(maxRounds)} dépassé`
      : `${num(rounds)} tour${rounds === 1 ? "" : "s"} sur ${num(maxRounds)}`;
    return `<div class="summary">
      <div class="share">
        <span class="pct">${fr(totals.percent, 1)} %</span>
        <div class="share-label">
          <b>du document lu</b>
          <span>${num(read)} ${noun}${read === 1 ? "" : "s"} sur ${num(totals.sections_total)} · ${num(totals.tokens_read)} tokens sur ${num(totals.tokens_total)}</span>
        </div>
      </div>
      <div class="gauge">
        <span class="pips" aria-hidden="true">${pips}</span>
        <span class="gauge-label${over ? " over" : ""}">${label}</span>
      </div>
      ${segments.length ? minimap(segments) : ""}
    </div>`;
  }

  // The whole document, one segment per section, the sections read lit.
  function minimap(segments) {
    const segs = segments
      .map(
        (s) =>
          `<span class="seg" data-status="${esc(s.status)}" style="flex-grow: ${Number(s.tokens) || 0}" title="${esc(s.title)}"></span>`
      )
      .join("");
    return `<div class="minimap" role="img" aria-label="Les sections lues, dans tout le document">${segs}</div>`;
  }

  function spareLabel(used, spare) {
    return spare === 1
      ? `Tour ${num(used + 1)} non utilisé.`
      : `Tours ${num(used + 1)} à ${num(used + spare)} non utilisés.`;
  }

  // ---- rounds ----------------------------------------------------------
  // One row per round. A cited round shows the quoted passage, boxed on its
  // page; a round read without a quote shows the page its section starts on.

  function roundRow(hop) {
    const uri = (hop.cited || [])[0] || hop.uri || "";
    const state = hopState(hop);
    const cites = (hop.cited || []).length;
    const tag = cites > 1 ? `${num(cites)} citations` : "cité";
    return `<li class="hop" data-state="${esc(state)}" data-hop="${esc(hop.hop_id)}"
      ${uri ? `data-uri="${esc(uri)}"` : ""}>
      <button type="button" class="shot ${uri ? "pending" : "none"}" data-shot
        aria-label="Agrandir la page"></button>
      <div class="round-body">
        <span class="round-kicker"><span class="badge ${state}">${num(hop.ordinal)}</span>Tour ${num(hop.ordinal)}/${num(maxRounds)}${state === "cited" ? `<span class="cited-tag">· ${tag}</span>` : ""}</span>
        <span class="hop-where">${esc(hop.title)}${hop.page ? `<span class="page"> · p.${num(hop.page)}</span>` : ""}</span>
        ${hop.why ? `<span class="round-why"><b>Pourquoi</b>${esc(hop.why)}</span>` : ""}
        ${hop.found ? `<span class="round-found"><b>Trouvé</b>${esc(hop.found)}</span>` : ""}
        ${isLink(hop.deep_link) ? `<button type="button" class="open-link" data-open="${esc(hop.deep_link)}">Ouvrir dans Studio ↗</button>` : ""}
      </div>
    </li>`;
  }

  // ---- thumbnails -----------------------------------------------------
  // Fetched only when the path is opened, through the view's own app-only
  // tool, and remembered: the record tab stays as cheap as it was, and a
  // second visit to the path costs nothing.

  // No one-shot latch here, on purpose: `render` rebuilds every tile on a
  // re-pushed result, so the work is derived from state each time — a tile
  // whose uri has no settled entry is a tile to fetch. `inflight` is what
  // stops two overlapping invocations fetching the same page twice, and a
  // capability refusal is remembered so rebuilt tiles regain their message
  // instead of regressing to a blank rectangle that never fills in.

  const thumbs = new Map();
  const inflight = new Set();
  let noServerTools = false;

  async function hydratePath() {
    const hops = [...root.querySelectorAll(".hop[data-uri]")];
    hops.forEach((hop) => {
      const cached = thumbs.get(hop.dataset.uri);
      if (cached) paintShot(hop, cached);
    });

    const negotiated = await handshake();
    if (negotiated && host.capabilities && !host.capabilities.serverTools) noServerTools = true;
    if (noServerTools) {
      failShots("This host does not relay tool calls: no page previews.");
      return;
    }

    // A small pool rather than a volley: each fetch rasterizes a page. A
    // timed-out fetch is queued again — the timeout was the local clock's
    // verdict, not the server's — while a server refusal stays refused.
    const queue = [...new Set(hops.map((hop) => hop.dataset.uri))].filter((uri) => {
      if (inflight.has(uri)) return false;
      const cached = thumbs.get(uri);
      return !cached || cached.retriable === true;
    });
    queue.forEach((uri) => inflight.add(uri));
    const workers = Array.from({ length: Math.min(3, queue.length) }, async () => {
      for (let uri = queue.shift(); uri; uri = queue.shift()) {
        try {
          const image = await fetchThumb(uri);
          thumbs.set(uri, { image });
        } catch (error) {
          thumbs.set(uri, {
            error: error.message || "no preview",
            retriable: error.message === TIMEOUT_MESSAGE,
          });
        } finally {
          inflight.delete(uri);
        }
        root.querySelectorAll(`.hop[data-uri="${cssEscape(uri)}"]`).forEach((hop) => {
          paintShot(hop, thumbs.get(uri));
        });
      }
    });
    await Promise.all(workers);
  }

  async function fetchThumb(uri, maxWidth = 320, page = null) {
    // Twice the default budget: the first fetch of a page can pay for the
    // whole document to be rasterized, and a premature timeout would cache
    // a failure the server never produced.
    const result = await call(
      "tools/call",
      {
        name: "get_source_page",
        arguments: page == null ? { uri, max_width: maxWidth } : { uri, max_width: maxWidth, page },
      },
      20000
    );
    if (result && (result.isError || result.is_error)) {
      throw new Error(result?.content?.[0]?.text || "the server refused");
    }
    const image =
      result?.structuredContent ??
      result?.structured_content ??
      JSON.parse(result?.content?.[0]?.text ?? "{}");
    if (!image || !image.data_uri || !image.width || !image.height) {
      throw new Error("the answer carried no image");
    }
    return image;
  }

  function paintShot(hop, cached) {
    const shot = hop.querySelector(".shot");
    if (!shot) return;
    if (cached.error) {
      shot.classList.remove("pending");
      shot.classList.add("failed");
      shot.innerHTML = `<span class="ph">${esc(cached.error)}</span>`;
      return;
    }
    const image = cached.image;
    // The box arrives in the image's own pixels, so the overlay is a
    // percentage of the rendered size — same contract as the citation view.
    const box = image.highlight;
    const mark = box
      ? `<span class="mark" style="left:${(box[0] / image.width) * 100}%;top:${
          (box[1] / image.height) * 100
        }%;width:${((box[2] - box[0]) / image.width) * 100}%;height:${
          ((box[3] - box[1]) / image.height) * 100
        }%"></span>`
      : "";
    shot.classList.remove("pending", "failed");
    shot.style.aspectRatio = `${image.width} / ${image.height}`;
    shot.style.height = "auto";
    shot.innerHTML =
      `<img alt="Page ${esc(image.page)}, the passage boxed" src="${esc(image.data_uri)}">` +
      mark +
      '<span class="glass" aria-hidden="true">⤢</span>';
    shot.setAttribute("aria-label", `Enlarge page ${image.page}`);
    const label = hop.querySelector(".hop-where");
    if (label && !label.querySelector(".page") && image.page) {
      label.insertAdjacentHTML("beforeend", `<span class="page"> · p.${esc(image.page)}</span>`);
    }
  }

  function failShots(message) {
    root.querySelectorAll(".hop[data-uri] .shot").forEach((shot) => {
      shot.classList.remove("pending");
      shot.classList.add("failed");
      shot.innerHTML = `<span class="ph">${esc(message)}</span>`;
    });
  }

  // ---- the enlarged page ----------------------------------------------
  // A 138px tile answers "which page"; it cannot answer "what does it say",
  // which is why someone clicks it. Same contract as the citation view:
  // fullscreen is requested, never assumed, and the host that refuses still
  // gets the overlay filling the card's own frame. The thumbnail stands in,
  // upscaled and faintly blurred, until the readable render lands — the same
  // page, marker already in place, so nothing jumps under the reader.

  const LENS_WIDTH = 1400;
  // Reading width overflows a short frame, and that is the point of − and
  // Fit: "show me the whole page" is the other half of enlarging one. + is
  // "closer", uncapped by the frame, with the stage scrolling.
  const ZOOM_STEP = 1.25;
  const ZOOM_MIN = 0.2;
  const ZOOM_MAX = 3;
  const bigThumbs = new Map();
  let lensUri = null;
  let lensLoading = false;
  let lensZoom = 1;

  const lens = document.createElement("div");
  lens.className = "lens";
  lens.hidden = true;
  lens.setAttribute("role", "dialog");
  lens.setAttribute("aria-modal", "true");
  lens.setAttribute("aria-label", "Enlarged page");
  lens.innerHTML =
    '<div class="lens-bar"><span class="lens-title" id="lens-title"></span>' +
    '<span class="lens-tools">' +
    '<button type="button" data-lens-prev aria-label="Previous page">‹</button>' +
    '<button type="button" data-lens-next aria-label="Next page">›</button>' +
    '<button type="button" data-lens-out aria-label="Zoom out">−</button>' +
    '<button type="button" data-lens-fit aria-label="Fit the whole page">Fit</button>' +
    '<button type="button" data-lens-in aria-label="Zoom in">+</button>' +
    '<button type="button" id="lens-close">Close</button>' +
    "</span></div>" +
    '<div class="lens-stage" id="lens-stage"></div>';
  document.body.appendChild(lens);
  lens.querySelector("#lens-close").addEventListener("click", closeLens);
  lens.querySelector("[data-lens-prev]").addEventListener("click", () => goLens(-1));
  lens.querySelector("[data-lens-next]").addEventListener("click", () => goLens(1));
  lens.querySelector("[data-lens-out]").addEventListener("click", () => zoomLens(1 / ZOOM_STEP));
  lens.querySelector("[data-lens-in]").addEventListener("click", () => zoomLens(ZOOM_STEP));
  lens.querySelector("[data-lens-fit]").addEventListener("click", fitLens);
  // The scrim closes; the page itself does not.
  lens.addEventListener("click", (event) => {
    if (event.target === lens || event.target.id === "lens-stage") closeLens();
  });
  document.addEventListener("keydown", (event) => {
    if (lens.hidden) return;
    if (event.key === "Escape") closeLens();
    else if (event.key === "+" || event.key === "=") zoomLens(ZOOM_STEP);
    else if (event.key === "-") zoomLens(1 / ZOOM_STEP);
    else if (event.key === "ArrowLeft") goLens(-1);
    else if (event.key === "ArrowRight") goLens(1);
  });

  // Which page the lens is on: null is the anchor's own page — the one with
  // a passage to mark, and the one the tile's thumbnail can stand in for.
  let lensPage = null;
  const lensKey = () => `${lensUri}|${lensPage ?? "self"}`;

  function openLens(uri) {
    lensUri = uri;
    lensPage = null;
    lensZoom = 1;
    lens.hidden = false;
    paintLens();
    lens.querySelector("#lens-close").focus();
    call("ui/request-display-mode", { mode: "fullscreen" }).catch(() => {});
    ensureLensPage();
  }

  // Leafing through the document the anchor pins. Turning back onto the
  // anchor's page returns to the `null` key on purpose: that entry carries
  // the highlight, and the tile thumbnail can stand in while it loads.
  function goLens(delta) {
    const current = lensImageNow();
    if (!current || !current.page_count) return;
    const target = Math.max(1, Math.min(current.page + delta, current.page_count));
    if (target === current.page) return;
    const small = thumbs.get(lensUri);
    const anchorPage = small && small.image ? small.image.page : null;
    lensPage = target === anchorPage ? null : target;
    paintLens();
    ensureLensPage();
  }

  function lensImageNow() {
    const small = thumbs.get(lensUri);
    return bigThumbs.get(lensKey()) || (lensPage == null ? small && small.image : null) || null;
  }

  function zoomLens(factor) {
    lensZoom = Math.min(ZOOM_MAX, Math.max(ZOOM_MIN, lensZoom * factor));
    paintLens();
  }

  // The whole page at once, never upscaled past reading width: blur is a
  // poor trade for size.
  function fitLens() {
    const enlarged = bigThumbs.get(lensKey());
    const image = lensImageNow();
    const stage = lens.querySelector("#lens-stage");
    if (!image || !stage) return;
    const box = stage.getBoundingClientRect();
    if (!box.width || !box.height) return;
    const base = enlarged ? enlarged.width : 860;
    const aspect = image.height / image.width;
    const target = Math.min(box.width - 16, (box.height - 16) / aspect);
    lensZoom = Math.min(1, Math.max(ZOOM_MIN, target / base));
    paintLens();
  }

  function closeLens() {
    if (lens.hidden) return;
    lens.hidden = true;
    lensUri = null;
    call("ui/request-display-mode", { mode: "inline" }).catch(() => {});
  }

  async function ensureLensPage() {
    const key = lensKey();
    if (bigThumbs.has(key) || lensLoading) return;
    lensLoading = true;
    const uri = lensUri;
    const page = lensPage;
    try {
      bigThumbs.set(key, await fetchThumb(uri, LENS_WIDTH, page));
    } catch (_) {
      // On the anchor's page the thumbnail already stands in; a failed
      // upgrade costs sharpness, not the answer. On any other, the previous
      // page simply keeps the stage.
    } finally {
      lensLoading = false;
      if (!lens.hidden && lensUri === uri && lensPage === page) {
        paintLens();
      } else if (!lens.hidden) {
        // The reader turned again while this page was rendering.
        ensureLensPage();
      }
    }
  }

  function paintLens() {
    const enlarged = bigThumbs.get(lensKey());
    const image = lensImageNow();
    const title = lens.querySelector("#lens-title");
    if (!image) {
      // Turning to a page not fetched yet: the previous page holds the
      // stage rather than flashing it empty.
      if (title) title.innerHTML = `page <b>${esc(lensPage ?? "…")}</b> · turning…`;
      return;
    }
    const box = image.highlight;
    const mark = box
      ? `<span class="mark" style="left:${(box[0] / image.width) * 100}%;top:${
          (box[1] / image.height) * 100
        }%;width:${((box[2] - box[0]) / image.width) * 100}%;height:${
          ((box[3] - box[1]) / image.height) * 100
        }%"></span>`
      : "";
    const provisional = enlarged ? "" : " provisional";
    const base = enlarged ? image.width : 860;
    const width = Math.round(base * lensZoom);
    // Past 100% the frame's cap comes off: magnifying into a cap would be a
    // button that does nothing.
    const cap = lensZoom > 1 ? "none" : "100%";
    const alt = mark
      ? `Page ${esc(image.page)}, the passage boxed`
      : `Page ${esc(image.page)}`;
    lens.querySelector("#lens-stage").innerHTML =
      `<div class="lens-page${provisional}" style="width:${width}px;max-width:${cap}">` +
      `<img alt="${alt}" src="${esc(image.data_uri)}">${mark}</div>`;
    const pages = image.page_count ? ` / ${esc(image.page_count)}` : "";
    const zoom = lensZoom === 1 ? "" : ` · ${Math.round(lensZoom * 100)}%`;
    title.innerHTML =
      `page <b>${esc(image.page)}</b>${pages}${zoom}` + (enlarged ? "" : " · sharpening…");
    lens.querySelector("[data-lens-prev]").disabled = image.page <= 1;
    lens.querySelector("[data-lens-next]").disabled =
      !image.page_count || image.page >= image.page_count;
  }

  // CSS.escape is everywhere the sandbox runs; the fallback quotes enough
  // for a dstudio:// uri or a server-minted step id, the only two things
  // ever interpolated through it.
  const cssEscape = (value) =>
    typeof CSS !== "undefined" && CSS.escape
      ? CSS.escape(value)
      : String(value).replaceAll(/["\\\]]/g, "\\$&");

  // ---- wiring ----------------------------------------------------------

  function wire() {
    // `ui/open-link` is the host's job: an app cannot navigate the user by
    // itself, and hosts gate this behind their own confirmation.
    root.querySelectorAll("[data-open]").forEach((button) => {
      button.addEventListener("click", () => {
        post({ jsonrpc: "2.0", id: Date.now(), method: "ui/open-link", params: { url: button.dataset.open } });
      });
    });
    // A page enlarges once its thumbnail has landed.
    root.querySelectorAll(".hop [data-shot]").forEach((button) => {
      button.addEventListener("click", () => {
        const hop = button.closest(".hop");
        const cached = thumbs.get(hop.dataset.uri);
        if (cached && cached.image) openLens(hop.dataset.uri);
      });
    });
  }

  function post(message) {
    try { window.parent?.postMessage(message, "*"); } catch (_) { /* no host, no-op */ }
  }

  // ---- the bridge ------------------------------------------------------
  // JSON-RPC 2.0 over postMessage, as the MCP Apps spec defines it. The
  // card renders from the tool result alone; the only fetches are the
  // handshake and, when the path is opened, `get_source_page` — one
  // thumbnail per section read, never eagerly, and the same page again at
  // reading width when someone enlarges it.

  const pending = new Map();
  let nextRequestId = 1;
  // Named so the thumbnail cache can tell a local timeout — worth retrying —
  // from an answer the server actually gave.
  const TIMEOUT_MESSAGE = "the host did not answer";

  function call(method, params, timeoutMs = 8000) {
    return new Promise((resolve, reject) => {
      const id = `app-${nextRequestId++}`;
      const timer = setTimeout(() => {
        pending.delete(id);
        reject(new Error(TIMEOUT_MESSAGE));
      }, timeoutMs);
      pending.set(id, { resolve, reject, timer });
      post({ jsonrpc: "2.0", id, method, params });
    });
  }

  function settle(data) {
    const entry = data && data.id != null && pending.get(data.id);
    if (!entry) return false;
    pending.delete(data.id);
    clearTimeout(entry.timer);
    if (data.error) entry.reject(new Error(data.error.message || "call failed"));
    else entry.resolve(data.result);
    return true;
  }

  // ---- handshake -------------------------------------------------------
  // `ui/initialize`, then `ui/notifications/initialized` once the host has
  // answered. The notification is what allows the host to push the tool
  // result at all, so it is sent even when the request fails — withholding it
  // on a host that predates the handshake would trade a theme for a blank
  // card. The answer carries the theme to render in and the frame to fit.
  const PROTOCOL_VERSION = "2026-01-26";
  const HANDSHAKE_MS = 2500;
  let host = { capabilities: null, context: {} };
  let ready = null;

  function handshake() {
    if (ready) return ready;
    ready = call(
      "ui/initialize",
      {
        protocolVersion: PROTOCOL_VERSION,
        capabilities: {},
        appInfo: { name: "docling-studio-sources", version: "1" },
        appCapabilities: { availableDisplayModes: ["inline", "fullscreen"] },
      },
      HANDSHAKE_MS
    )
      .then((result) => {
        host = {
          capabilities: result?.hostCapabilities ?? null,
          context: result?.hostContext ?? {},
        };
        applyHostContext(host.context);
        return true;
      })
      .catch(() => false)
      .then((negotiated) => {
        post({ jsonrpc: "2.0", method: "ui/notifications/initialized", params: {} });
        return negotiated;
      });
    return ready;
  }

  function applyHostContext(context) {
    if (!context || typeof context !== "object") return;
    if (context.theme === "dark" || context.theme === "light") {
      document.documentElement.setAttribute("data-theme", context.theme);
    }
    applyContainerDimensions(context.containerDimensions);
    reportSize();
  }

  // The host owns the frame. A fixed `width` means "fill exactly this"; a
  // `maxWidth` means "grow up to here". `100%` rather than the spec snippet's
  // `100vw`, which counts the scrollbar gutter the client width does not —
  // on any platform with classic scrollbars that is a card a scrollbar wider
  // than its frame, cropped down the side.
  let frame = null;
  function applyContainerDimensions(dimensions) {
    if (!dimensions || typeof dimensions !== "object") return;
    frame = dimensions;
    const style = document.documentElement.style;
    if (typeof dimensions.width === "number") {
      style.width = "100%";
      style.maxWidth = "100%";
    } else if (typeof dimensions.maxWidth === "number") {
      style.maxWidth = `${dimensions.maxWidth}px`;
    }
    if (typeof dimensions.height === "number") style.height = "100%";
    else if (typeof dimensions.maxHeight === "number") {
      style.maxHeight = `${dimensions.maxHeight}px`;
    }
  }

  let lastHeight = 0;
  let lastWidth = 0;
  function reportSize() {
    const main = document.querySelector("main");
    if (!main) return;
    const height = Math.ceil(main.getBoundingClientRect().height);
    // Clamped to what the host declared: a host that honours this width sets
    // the frame from it, so asking for more than it offered is asking to be
    // cropped.
    const ceiling =
      typeof frame?.width === "number"
        ? frame.width
        : typeof frame?.maxWidth === "number"
          ? frame.maxWidth
          : Infinity;
    const width = Math.ceil(Math.min(document.documentElement.clientWidth, ceiling));
    if (!height) return;
    if (Math.abs(height - lastHeight) < 8 && width === lastWidth) return;
    lastHeight = height;
    lastWidth = width;
    post({
      jsonrpc: "2.0",
      method: "ui/notifications/size-changed",
      params: { width, height },
    });
  }

  if (typeof ResizeObserver === "function") {
    new ResizeObserver(reportSize).observe(document.querySelector("main"));
  }

  // Host -> app. Hosts differ in how much of the JSON-RPC envelope reaches
  // the guest, so the payload is dug out of every documented shape rather
  // than betting on one: params.result / result / the message itself,
  // structured content first, then the JSON in the text content block.
  function extract(data) {
    if (!data || typeof data !== "object") return null;
    for (const candidate of [data.params?.result, data.params, data.result, data]) {
      if (!candidate || typeof candidate !== "object") continue;
      const structured = candidate.structuredContent ?? candidate.structured_content;
      if (structured?.hops && structured.totals) return structured;
      if (candidate.hops && candidate.totals) return candidate;
      const text = candidate.content?.[0]?.text;
      if (typeof text === "string") {
        try {
          const parsed = JSON.parse(text);
          if (parsed?.hops && parsed.totals) return parsed;
        } catch (_) { /* not our payload */ }
      }
    }
    return null;
  }

  window.addEventListener("message", (event) => {
    // Only the host frame speaks for the host. Another app on the same page
    // can reach this window too, and would otherwise be rendered as a record
    // or answer this view's own calls.
    if (event.source !== window.parent) return;
    const data = event.data;
    if (settle(data)) return;

    // The host asks before tearing the view down and waits for the answer.
    if (data?.method === "ui/resource-teardown") {
      if (data.id != null) post({ jsonrpc: "2.0", id: data.id, result: {} });
      return;
    }
    if (data?.method === "ui/notifications/host-context-changed") {
      host = { ...host, context: { ...host.context, ...(data.params || {}) } };
      applyHostContext(host.context);
      // Put back inline by the host: the overlay follows.
      if (data.params?.displayMode === "inline") closeLens();
      return;
    }

    // A refused or cancelled call has nothing to show: say so rather than
    // leave the card waiting.
    if (data?.method === "ui/notifications/tool-cancelled") {
      showState("The call was cancelled.");
      return;
    }
    if (data?.method === "ui/notifications/tool-result" && data.params?.isError) {
      showState(`The call failed: ${data.params.content?.[0]?.text || "no detail"}`);
      return;
    }
    const view = extract(data);
    if (view) render(view);
    else if (data?.method === "ui/notifications/tool-result") {
      showState("The result carries no sources to show.");
    }
  });

  function showState(message) {
    root.className = "fallback";
    root.textContent = message;
    reportSize();
  }

  handshake();
</script>
</body>
</html>
