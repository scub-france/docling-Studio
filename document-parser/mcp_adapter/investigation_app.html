<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Investigation</title>
<style>
  /* Design tokens lifted from the Studio shell (frontend/src/app/App.vue) and
     shared with citation_app.html — same names, same values, so the two
     viewers and the product do not drift into three palettes. The product
     picks its theme with a class on <html>; an app in a sandboxed iframe
     cannot read the host's, so the media query decides and the handshake
     overrides it. */
  :root {
    color-scheme: light dark;
    --bg: #fafafa;
    --bg-surface: #ffffff;
    --bg-elevated: #f4f4f5;
    --bg-hover: #e4e4e7;
    --accent: #f97316;
    --accent-muted: rgba(249, 115, 22, 0.1);
    --text: #18181b;
    --text-secondary: #52525b;
    --text-muted: #a1a1aa;
    --border: #e4e4e7;
    --border-light: #d4d4d8;
    /* Verdict colours. Only three states are ever coloured — what the server
       kept, what it refused, and what it has not judged yet. `path` is a
       route rather than a finding, so it stays grey on purpose: colouring it
       would claim something happened there. */
    --kept: #15803d;
    --kept-bg: rgba(22, 163, 74, 0.12);
    --bad: #b91c1c;
    --bad-bg: rgba(220, 38, 38, 0.1);
    --radius: 8px;
    --radius-sm: 6px;
    --radius-lg: 12px;
    --sans: 'Inter', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
    --mono: 'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0a0a0b;
      --bg-surface: #111113;
      --bg-elevated: #1a1a1d;
      --bg-hover: #222226;
      --accent-muted: rgba(249, 115, 22, 0.15);
      --text: #ececef;
      --text-secondary: #a1a1aa;
      --text-muted: #63636e;
      --border: #27272a;
      --border-light: #3f3f46;
      --kept: #4ade80;
      --kept-bg: rgba(74, 222, 128, 0.14);
      --bad: #f87171;
      --bad-bg: rgba(248, 113, 113, 0.13);
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg: #0a0a0b;
    --bg-surface: #111113;
    --bg-elevated: #1a1a1d;
    --bg-hover: #222226;
    --accent-muted: rgba(249, 115, 22, 0.15);
    --text: #ececef;
    --text-secondary: #a1a1aa;
    --text-muted: #63636e;
    --border: #27272a;
    --border-light: #3f3f46;
    --kept: #4ade80;
    --kept-bg: rgba(74, 222, 128, 0.14);
    --bad: #f87171;
    --bad-bg: rgba(248, 113, 113, 0.13);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { max-width: 100%; }

  body {
    font-family: var(--sans);
    background: var(--bg);
    color: var(--text);
    font-size: 14px;
    line-height: 1.55;
    -webkit-font-smoothing: antialiased;
  }

  /* The card measures itself against `main`, never against the window: the
     host owns the frame width, and a viewport media query asked inside a
     400 px iframe answers a question about the frame, not about the card. */
  main {
    max-width: 940px;
    margin: 0 auto;
    padding: clamp(10px, 4vw, 20px);
    container-type: inline-size;
  }

  .card {
    min-width: 0;
    background: var(--bg-surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    overflow: hidden;
  }

  /* ---- header ------------------------------------------------------- */

  .head { padding: 16px 18px 14px; border-bottom: 1px solid var(--border); }
  .question {
    font-size: 16px;
    font-weight: 600;
    line-height: 1.4;
    letter-spacing: -0.01em;
    overflow-wrap: anywhere;
  }
  .origin {
    margin-top: 7px;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 6px;
    font-size: 11.5px;
    color: var(--text-muted);
  }
  .origin .doc { color: var(--text-secondary); overflow-wrap: anywhere; }
  .dot-sep { opacity: 0.5; }

  .badge {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    padding: 1px 7px;
    border-radius: 999px;
    border: 1px solid var(--border-light);
    font-size: 10.5px;
    font-weight: 600;
    letter-spacing: 0.03em;
    text-transform: uppercase;
    color: var(--text-secondary);
  }
  .badge.closed { color: var(--kept); border-color: var(--kept); background: var(--kept-bg); }
  .badge.open { color: var(--accent); border-color: var(--accent); background: var(--accent-muted); }
  .badge.stale { color: var(--bad); border-color: var(--bad); background: var(--bad-bg); }

  /* ---- the two halves ------------------------------------------------ */
  /* A rail that answers "where in the document did this go", and a timeline
     that answers "what was tried, and what did the server make of it". */

  .body { display: grid; grid-template-columns: minmax(0, 1fr); }
  @container (min-width: 620px) {
    .body { grid-template-columns: minmax(190px, 34cqi) minmax(0, 1fr); }
    .tree { border-right: 1px solid var(--border); border-bottom: none; }
    /* Folded, the rail gives its whole column back: the tree becomes a slim
       strip above the timeline — one header line holding the button that
       reopens it — and the timeline takes the full width. */
    .body:has(.tree.collapsed) { grid-template-columns: minmax(0, 1fr); }
    .tree.collapsed { border-right: 0; border-bottom: 1px solid var(--border); }
  }

  .tree, .timeline { min-width: 0; padding: 14px 16px 16px; }
  .tree { background: var(--bg-elevated); border-bottom: 1px solid var(--border); }

  h2 {
    font-size: 10.5px;
    font-weight: 600;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--text-muted);
    margin-bottom: 9px;
  }

  /* ---- tabs ----------------------------------------------------------- */
  /* Two readings of one record. The record is the ledger — tree + timeline,
     every verdict in place. The path is the same steps laid out as the
     journey they took through the document, one page thumbnail per kept ref. */

  .tabs {
    display: flex;
    gap: 2px;
    padding: 0 12px;
    border-bottom: 1px solid var(--border);
  }
  .tab {
    appearance: none;
    background: none;
    border: 0;
    border-bottom: 2px solid transparent;
    margin-bottom: -1px;
    padding: 8px 10px 7px;
    font: inherit;
    font-size: 12px;
    font-weight: 600;
    color: var(--text-muted);
    cursor: pointer;
  }
  .tab:hover { color: var(--text-secondary); }
  .tab[aria-selected="true"] { color: var(--text); border-bottom-color: var(--accent); }
  [data-view="record"] .pane-path { display: none; }
  [data-view="path"] .pane-record { display: none; }

  /* ---- the fold ------------------------------------------------------- */
  /* Folding the tree reclaims its whole pane, not just its list: on a wide
     card the rail's column collapses too (see the container query above),
     which is the room the fold exists to give back. */

  h2 .fold {
    appearance: none;
    background: none;
    border: 0;
    padding: 0;
    margin: 0;
    font: inherit;
    color: inherit;
    letter-spacing: inherit;
    text-transform: inherit;
    display: inline-flex;
    align-items: center;
    gap: 5px;
    cursor: pointer;
  }
  .chev {
    display: inline-block;
    font-size: 8px;
    transition: transform 0.15s ease;
  }
  .tree.collapsed .chev { transform: rotate(-90deg); }
  .tree.collapsed .nodes { display: none; }
  .tree.collapsed h2 { margin-bottom: 0; }

  /* ---- the path ------------------------------------------------------- */
  /* One tile per step, in the order they were worked, joined left to right.
     The tile shows the page the kept ref sits on with the passage boxed; a
     step nothing was kept for shows its state instead of borrowing a page it
     did not earn. */

  .pane-path { padding: 14px 16px 16px; }
  .flow {
    display: flex;
    align-items: flex-start;
    overflow-x: auto;
    padding: 4px 2px 10px;
  }
  .hop {
    flex: 0 0 138px;
    display: grid;
    gap: 5px;
  }
  .hop button {
    background: none;
    border: 0;
    padding: 0;
    font: inherit;
    text-align: left;
    color: inherit;
    cursor: pointer;
  }
  .hop-meta { display: grid; gap: 5px; }
  .hop-meta:hover .hop-where { color: var(--accent); }
  .hop-top {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 6px;
  }
  .hop-top .ord { font-size: 11px; font-weight: 600; color: var(--text-muted); }
  .hop-state {
    font-size: 9.5px;
    font-weight: 600;
    letter-spacing: 0.03em;
    text-transform: uppercase;
    color: var(--text-muted);
  }
  .hop-state.answered { color: var(--kept); }
  .hop-state.unanswered { color: var(--bad); }
  .hop .shot {
    position: relative;
    display: block;
    width: 100%;
    border: 1px solid var(--border-light);
    border-radius: var(--radius-sm);
    background: var(--bg-elevated);
    overflow: hidden;
  }
  .shot.pending, .shot.none, .shot.failed { height: 150px; }
  .shot .glass {
    position: absolute;
    right: 5px;
    bottom: 5px;
    width: 22px;
    height: 22px;
    border-radius: 50%;
    display: grid;
    place-items: center;
    font-size: 12px;
    color: #fff;
    background: color-mix(in srgb, var(--text) 72%, transparent);
    opacity: 0;
    transition: opacity 0.12s ease;
  }
  .hop .shot:hover .glass,
  .hop .shot:focus-visible .glass { opacity: 1; }
  .hop[data-state="answered"] .shot { border-color: var(--kept); }
  .hop[data-state="unanswered"] .shot { border-style: dashed; border-color: var(--bad); }
  .hop[data-state="abandoned"] .shot,
  .hop[data-state="pending"] .shot { border-style: dashed; }
  .shot img { display: block; width: 100%; height: auto; }
  .shot .mark {
    position: absolute;
    border: 1.5px solid var(--accent);
    background: var(--accent-muted);
    border-radius: 2px;
  }
  .shot .ph {
    position: absolute;
    inset: 0;
    display: grid;
    place-items: center;
    padding: 8px;
    font-size: 10.5px;
    text-align: center;
    color: var(--text-muted);
  }
  .hop .shot:hover,
  .hop .shot:focus-visible { border-color: var(--accent); }

  /* ---- the enlarged page ---------------------------------------------- */
  /* Same shape as the citation view's lens: on <body>, not inside <main>,
     because an overlay meant to fill the frame must not inherit the card's
     layout. The thumbnail stands in, upscaled, while the readable render is
     on its way — the same page, marker already in place. */
  .lens {
    position: fixed;
    inset: 0;
    z-index: 50;
    display: grid;
    grid-template-rows: auto minmax(0, 1fr);
    gap: 10px;
    padding: 14px;
    background: color-mix(in srgb, var(--bg) 88%, #000);
  }
  .lens[hidden] { display: none; }
  .lens-bar { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .lens-title { font-family: var(--mono); font-size: 12px; color: var(--text-secondary); }
  .lens-title b { color: var(--accent); font-weight: 600; }
  .lens-bar button {
    font: inherit;
    font-size: 12.5px;
    padding: 4px 12px;
    border-radius: var(--radius-sm);
    border: 1px solid var(--border-light);
    background: var(--bg-surface);
    color: var(--text);
    cursor: pointer;
  }
  .lens-bar button:hover { border-color: var(--accent); color: var(--accent); }
  .lens-bar button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .lens-bar button:disabled { opacity: 0.4; cursor: default; }
  .lens-bar button:disabled:hover { border-color: var(--border-light); color: var(--text); }
  .lens-tools { margin-left: auto; display: flex; gap: 6px; }
  .lens-stage { display: grid; place-items: center; min-height: 0; overflow: auto; }
  .lens-page {
    position: relative;
    line-height: 0;
    background: #fff;
    border-radius: var(--radius-sm);
    overflow: hidden;
    box-shadow: 0 12px 44px rgba(0, 0, 0, 0.34);
  }
  .lens-page img { display: block; max-width: 100%; height: auto; }
  .lens-page.provisional img { filter: blur(0.4px); }
  .lens-page .mark {
    position: absolute;
    border: 1.5px solid var(--accent);
    background: var(--accent-muted);
    border-radius: 2px;
  }
  .hop-where {
    font-size: 11px;
    font-weight: 550;
    color: var(--text-secondary);
    overflow-wrap: anywhere;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .hop-where .page { color: var(--text-muted); font-weight: 400; }
  .hop-q {
    font-size: 10.5px;
    color: var(--text-muted);
    overflow-wrap: anywhere;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .flow .link {
    flex: 0 0 auto;
    align-self: center;
    padding: 0 6px;
    color: var(--text-muted);
    font-size: 13px;
    user-select: none;
  }

  /* ---- navigation tree ----------------------------------------------- */

  .node {
    display: grid;
    grid-template-columns: 12px minmax(0, 1fr);
    gap: 7px;
    align-items: baseline;
    width: 100%;
    text-align: left;
    background: none;
    border: 0;
    border-radius: var(--radius-sm);
    padding: 3px 5px;
    font: inherit;
    font-size: 12.5px;
    color: var(--text-secondary);
    cursor: pointer;
  }
  .node:hover { background: var(--bg-hover); }
  .node.lit { background: var(--accent-muted); color: var(--text); }
  .node .pin {
    width: 7px; height: 7px;
    border-radius: 50%;
    background: var(--border-light);
    justify-self: center;
    transform: translateY(-1px);
  }
  .node[data-status="kept"] { color: var(--text); font-weight: 550; }
  .node[data-status="kept"] .pin { background: var(--kept); }
  .node[data-status="rejected"] .pin { background: var(--bad); }
  .node[data-status="visited"] .pin { background: var(--text-muted); }
  .node[data-status="path"] .pin { background: transparent; border: 1px solid var(--border-light); }
  .node .label { overflow-wrap: anywhere; }
  .node .page { color: var(--text-muted); font-size: 11px; }

  .empty { font-size: 12.5px; color: var(--text-muted); font-style: italic; }

  /* ---- timeline ------------------------------------------------------ */

  .step { border-top: 1px solid var(--border); padding: 11px 0 3px; }
  .step:first-of-type { border-top: 0; padding-top: 2px; }
  .step.lit .step-q { color: var(--accent); }

  .step-head {
    display: grid;
    grid-template-columns: minmax(0, 1fr) auto;
    gap: 10px;
    align-items: baseline;
    width: 100%;
    text-align: left;
    background: none;
    border: 0;
    padding: 0;
    font: inherit;
    cursor: pointer;
    color: inherit;
  }
  .step-q { font-weight: 600; font-size: 13.5px; overflow-wrap: anywhere; }
  .step-q .ord { color: var(--text-muted); font-weight: 500; margin-right: 5px; }
  .step-why {
    font-size: 12px;
    color: var(--text-muted);
    margin-top: 1px;
    overflow-wrap: anywhere;
  }

  /* The attempt budget, spent left to right. A step is legible at a glance:
     three filled marks and no green means the document did not answer. */
  .pips { display: inline-flex; gap: 3px; align-items: center; white-space: nowrap; }
  .pip {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--border-light);
  }
  .pip.kept { background: var(--kept); }
  .pip.rejected { background: var(--bad); }
  .pip.pending { background: var(--text-muted); }
  .pip.left { background: transparent; border: 1px solid var(--border-light); }
  .state {
    font-size: 10.5px;
    font-weight: 600;
    letter-spacing: 0.03em;
    text-transform: uppercase;
    color: var(--text-muted);
    margin-left: 7px;
  }
  .state.answered { color: var(--kept); }
  .state.unanswered { color: var(--bad); }

  .attempts { margin: 8px 0 4px; display: grid; gap: 7px; }
  .attempt {
    border-left: 2px solid var(--border-light);
    padding: 1px 0 1px 10px;
  }
  .attempt[data-outcome="kept"] { border-left-color: var(--kept); }
  .attempt.rejected { border-left-color: var(--bad); }

  /* The thought is the model's own words, and nothing checked it. Italic is
     doing real work here: it is what tells a reader this line is testimony
     and the chip beside it is evidence. */
  .thought {
    font-style: italic;
    font-size: 12.5px;
    color: var(--text-secondary);
    overflow-wrap: anywhere;
  }
  .verdict {
    margin-top: 3px;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 6px;
    font-size: 11.5px;
    color: var(--text-muted);
  }
  .chip {
    padding: 0 6px;
    border-radius: var(--radius-sm);
    font-family: var(--mono);
    font-size: 10.5px;
    font-weight: 600;
    letter-spacing: 0.01em;
    background: var(--bg-hover);
    color: var(--text-secondary);
  }
  .chip.kept { background: var(--kept-bg); color: var(--kept); }
  .chip.rejected { background: var(--bad-bg); color: var(--bad); }
  .ref {
    font-family: var(--mono);
    font-size: 10.5px;
    color: var(--text-muted);
    overflow-wrap: anywhere;
  }
  .detail { font-size: 11.5px; color: var(--text-muted); overflow-wrap: anywhere; }
  .said {
    margin-top: 4px;
    font-size: 11.5px;
    color: var(--text-secondary);
    background: var(--bg-elevated);
    border-radius: var(--radius-sm);
    padding: 4px 7px;
    overflow-wrap: anywhere;
  }
  .said b { font-weight: 600; color: var(--text-muted); font-style: normal; }

  /* ---- footer -------------------------------------------------------- */

  .foot { border-top: 1px solid var(--border); padding: 13px 18px 15px; }
  .answer { font-size: 13.5px; overflow-wrap: anywhere; white-space: pre-wrap; }
  .tally {
    margin-top: 10px;
    display: flex;
    flex-wrap: wrap;
    gap: 5px 10px;
    font-size: 11px;
    color: var(--text-muted);
  }
  /* Said once, plainly, on the artefact itself — not only in the docs nobody
     reads next to the card. A stored trace looks certified; half of it is
     not. */
  .caveat {
    margin-top: 8px;
    font-size: 11px;
    line-height: 1.5;
    color: var(--text-muted);
    border-left: 2px solid var(--border-light);
    padding-left: 8px;
  }

  .fallback { padding: 18px; font-size: 13px; color: var(--text-secondary); }
</style>
</head>
<body>
<main>
  <div class="fallback" id="root">Waiting for the investigation…</div>
</main>
<script>
  "use strict";

  // Every interpolation of model- or document-derived text goes through this
  // before it becomes markup. The server already defuses the content-wrapper
  // delimiter on its way out; this is the second half of the same promise,
  // because a thought is a string a model wrote after reading a PDF.
  const esc = (value) =>
    String(value ?? "")
      .replaceAll("&", "&amp;")
      .replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;")
      .replaceAll('"', "&quot;")
      .replaceAll("'", "&#39;");

  const num = (value) => String(value ?? "").replace(/\B(?=(\d{3})+(?!\d))/g, " ");
  const short = (id) => (id && id.length > 12 ? id.slice(0, 8) + "…" : id || "—");

  // Rejections read better as words than as enum names, and the reader needs
  // to tell "the quote is not there" from "the ref is not there".
  const OUTCOMES = {
    kept: "kept",
    quote_drift: "quote drift",
    unknown_ref: "unknown ref",
    empty_element: "empty element",
    bad_anchor: "bad anchor",
    foreign_document: "other document",
  };

  const isKept = (outcome) => outcome === "kept";
  const isRejected = (outcome) => Boolean(outcome) && outcome !== "kept";

  // Unanswered with nothing tried is a step that was dropped, not one the
  // document failed to answer. Two honest outcomes, two different findings —
  // showing both as "unanswered" would blame the document for a decision the
  // agent made.
  const wasAbandoned = (step) =>
    step.state === "unanswered" && !(step.attempts || []).length;
  const stateLabel = (step) => (wasAbandoned(step) ? "abandoned" : step.state);

  const root = document.getElementById("root");

  // Presentation state, kept outside `render` so a re-push of the result —
  // or a hop into the record — lands on the reading the person had chosen.
  let activeTab = "record";
  let treeCollapsed = false;

  function render(view) {
    const steps = Array.isArray(view.reasoning) ? view.reasoning : [];
    const nodes = Array.isArray(view.map) ? view.map : [];
    const closed = view.state === "closed";

    root.className = "card";
    root.dataset.view = activeTab;
    root.innerHTML = `
      <div class="head">
        <div class="question">${esc(view.question)}</div>
        <div class="origin">
          <span class="badge ${closed ? "closed" : "open"}">${esc(view.state)}</span>
          ${view.stale ? '<span class="badge stale">stale parse</span>' : ""}
          <span class="doc">${esc(view.filename || view.document_id)}</span>
          <span class="dot-sep">·</span>
          <span>parse ${esc(short(view.version_id))}</span>
        </div>
      </div>
      <div class="tabs" role="tablist">
        <button class="tab" role="tab" id="tab-record" data-tab="record"
          aria-controls="pane-record" aria-selected="${activeTab === "record"}"
          tabindex="${activeTab === "record" ? 0 : -1}">Record</button>
        <button class="tab" role="tab" id="tab-path" data-tab="path"
          aria-controls="pane-path" aria-selected="${activeTab === "path"}"
          tabindex="${activeTab === "path" ? 0 : -1}">Path</button>
      </div>
      <div class="body pane-record" role="tabpanel" id="pane-record" aria-labelledby="tab-record">
        <section class="tree${treeCollapsed ? " collapsed" : ""}">
          <h2><button class="fold" data-fold aria-controls="tree-nodes"
            aria-expanded="${!treeCollapsed}"><span
            class="chev" aria-hidden="true">▾</span>Where it went</button></h2>
          <div class="nodes" id="tree-nodes">
          ${nodes.length ? nodes.map(nodeRow).join("") : '<p class="empty">Nothing located in the document yet.</p>'}
          </div>
        </section>
        <section class="timeline">
          <h2>What it did</h2>
          ${steps.length ? steps.map((step) => stepBlock(step, view)).join("") : '<p class="empty">No steps planned yet.</p>'}
        </section>
      </div>
      <section class="pane-path" role="tabpanel" id="pane-path" aria-labelledby="tab-path">
        <h2>How it moved</h2>
        ${steps.length ? `<div class="flow">${flowStrip(steps, nodes)}</div>` : '<p class="empty">No steps planned yet.</p>'}
      </section>
      <div class="foot">
        ${view.answer ? `<div class="answer">${esc(view.answer)}</div>` : ""}
        <div class="tally">${tally(view, steps).join('<span class="dot-sep">·</span>')}</div>
        <p class="caveat">Each thought is what the agent said it was doing, recorded as
        written and never checked. The verdict beside it — kept, quote drift, unknown
        ref — is the server's, reached by re-reading the document.</p>
      </div>`;

    wire();
    // The rebuilt DOM carries no .lit classes, so the tracker must not
    // claim otherwise — a stale key would turn the next click into a clear.
    lit = "";
    if (activeTab === "path") hydratePath();
  }

  // ---- the path ------------------------------------------------------
  // The same steps the timeline lists, laid end to end in the order they
  // were worked. Only a kept ref earns a page: a step the document did not
  // answer shows its state, because a thumbnail under an unanswered step
  // would claim the investigation found something there.

  function flowStrip(steps, nodes) {
    const where = nodesByStep(nodes);
    return steps
      .map((step) => hopTile(step, where.get(step.step_id)))
      .join('<span class="link" aria-hidden="true">→</span>');
  }

  // The map already knows which outline section each step reached; prefer
  // the node a ref was kept at over one that was merely tried.
  function nodesByStep(nodes) {
    const byStep = new Map();
    for (const node of nodes) {
      for (const id of node.step_ids || []) {
        const seen = byStep.get(id);
        if (!seen || (node.status === "kept" && seen.status !== "kept")) byStep.set(id, node);
      }
    }
    return byStep;
  }

  // Two buttons, not one: the page enlarges, the words jump to the step in
  // the record. One button doing both would have to guess which the click
  // meant. A shot with no page to enlarge jumps too, so no tile is dead.
  function hopTile(step, node) {
    const kept = (step.attempts || []).find((attempt) => isKept(attempt.outcome));
    const uri = kept ? kept.kept_uri || kept.uri : "";
    const state = stateLabel(step);
    const where = node ? node.title : uri ? refOf(uri) : "";
    return `<div class="hop" data-state="${esc(state)}" data-hop="${esc(step.step_id)}"
      ${uri ? `data-uri="${esc(uri)}"` : ""}>
      <span class="hop-top">
        <span class="ord">${esc(step.ordinal)}</span>
        <span class="hop-state ${esc(state)}">${esc(state)}</span>
      </span>
      <button class="shot ${uri ? "pending" : "none"}" data-shot
        aria-label="${uri ? "Enlarge the page" : "Open this step in the record"}">${
          uri ? "" : `<span class="ph">${esc(OUTCOMES_EMPTY[state] || state)}</span>`
        }</button>
      <button class="hop-meta" data-jump title="${esc(step.question)}">
        <span class="hop-where">${esc(where || "—")}${
          node && node.page ? `<span class="page"> · p.${esc(node.page)}</span>` : ""
        }</span>
        <span class="hop-q">${esc(step.question)}</span>
      </button>
    </div>`;
  }

  // What an empty tile says. Terser than the timeline's chips: a tile has
  // room for a verdict, not for a sentence.
  const OUTCOMES_EMPTY = {
    unanswered: "the document did not answer",
    abandoned: "dropped, with a reason on the record",
    pending: "not worked yet",
  };

  // ---- thumbnails -----------------------------------------------------
  // Fetched only when the path is opened, through the view's own app-only
  // tool, and remembered: the record tab stays as cheap as it was, and a
  // second visit to the path costs nothing.

  // No one-shot latch here, on purpose: `render` rebuilds every tile on a
  // re-pushed result, so the work is derived from state each time — a tile
  // whose uri has no settled entry is a tile to fetch. `inflight` is what
  // stops two overlapping invocations fetching the same page twice, and a
  // capability refusal is remembered so rebuilt tiles regain their message
  // instead of regressing to a blank rectangle that never fills in.

  const thumbs = new Map();
  const inflight = new Set();
  let noServerTools = false;

  async function hydratePath() {
    const hops = [...root.querySelectorAll(".hop[data-uri]")];
    hops.forEach((hop) => {
      const cached = thumbs.get(hop.dataset.uri);
      if (cached) paintShot(hop, cached);
    });

    const negotiated = await handshake();
    if (negotiated && host.capabilities && !host.capabilities.serverTools) noServerTools = true;
    if (noServerTools) {
      failShots("This host does not relay tool calls: no page previews.");
      return;
    }

    // A small pool rather than a volley: each fetch rasterizes a page. A
    // timed-out fetch is queued again — the timeout was the local clock's
    // verdict, not the server's — while a server refusal stays refused.
    const queue = [...new Set(hops.map((hop) => hop.dataset.uri))].filter((uri) => {
      if (inflight.has(uri)) return false;
      const cached = thumbs.get(uri);
      return !cached || cached.retriable === true;
    });
    queue.forEach((uri) => inflight.add(uri));
    const workers = Array.from({ length: Math.min(3, queue.length) }, async () => {
      for (let uri = queue.shift(); uri; uri = queue.shift()) {
        try {
          const image = await fetchThumb(uri);
          thumbs.set(uri, { image });
        } catch (error) {
          thumbs.set(uri, {
            error: error.message || "no preview",
            retriable: error.message === TIMEOUT_MESSAGE,
          });
        } finally {
          inflight.delete(uri);
        }
        root.querySelectorAll(`.hop[data-uri="${cssEscape(uri)}"]`).forEach((hop) => {
          paintShot(hop, thumbs.get(uri));
        });
      }
    });
    await Promise.all(workers);
  }

  async function fetchThumb(uri, maxWidth = 240, page = null) {
    // Twice the default budget: the first fetch of a page can pay for the
    // whole document to be rasterized, and a premature timeout would cache
    // a failure the server never produced.
    const result = await call(
      "tools/call",
      {
        name: "get_investigation_page",
        arguments: page == null ? { uri, max_width: maxWidth } : { uri, max_width: maxWidth, page },
      },
      20000
    );
    if (result && (result.isError || result.is_error)) {
      throw new Error(result?.content?.[0]?.text || "the server refused");
    }
    const image =
      result?.structuredContent ??
      result?.structured_content ??
      JSON.parse(result?.content?.[0]?.text ?? "{}");
    if (!image || !image.data_uri || !image.width || !image.height) {
      throw new Error("the answer carried no image");
    }
    return image;
  }

  function paintShot(hop, cached) {
    const shot = hop.querySelector(".shot");
    if (!shot) return;
    if (cached.error) {
      shot.classList.remove("pending");
      shot.classList.add("failed");
      shot.innerHTML = `<span class="ph">${esc(cached.error)}</span>`;
      return;
    }
    const image = cached.image;
    // The box arrives in the image's own pixels, so the overlay is a
    // percentage of the rendered size — same contract as the citation view.
    const box = image.highlight;
    const mark = box
      ? `<span class="mark" style="left:${(box[0] / image.width) * 100}%;top:${
          (box[1] / image.height) * 100
        }%;width:${((box[2] - box[0]) / image.width) * 100}%;height:${
          ((box[3] - box[1]) / image.height) * 100
        }%"></span>`
      : "";
    shot.classList.remove("pending", "failed");
    shot.style.aspectRatio = `${image.width} / ${image.height}`;
    shot.style.height = "auto";
    shot.innerHTML =
      `<img alt="Page ${esc(image.page)}, the kept passage boxed" src="${esc(image.data_uri)}">` +
      mark +
      '<span class="glass" aria-hidden="true">⤢</span>';
    shot.setAttribute("aria-label", `Enlarge page ${image.page}`);
    const label = hop.querySelector(".hop-where");
    if (label && !label.querySelector(".page") && image.page) {
      label.insertAdjacentHTML("beforeend", `<span class="page"> · p.${esc(image.page)}</span>`);
    }
  }

  function failShots(message) {
    root.querySelectorAll(".hop[data-uri] .shot").forEach((shot) => {
      shot.classList.remove("pending");
      shot.classList.add("failed");
      shot.innerHTML = `<span class="ph">${esc(message)}</span>`;
    });
  }

  // ---- the enlarged page ----------------------------------------------
  // A 138px tile answers "which page"; it cannot answer "what does it say",
  // which is why someone clicks it. Same contract as the citation view:
  // fullscreen is requested, never assumed, and the host that refuses still
  // gets the overlay filling the card's own frame. The thumbnail stands in,
  // upscaled and faintly blurred, until the readable render lands — the same
  // page, marker already in place, so nothing jumps under the reader.

  const LENS_WIDTH = 1400;
  // Reading width overflows a short frame, and that is the point of − and
  // Fit: "show me the whole page" is the other half of enlarging one. + is
  // "closer", uncapped by the frame, with the stage scrolling.
  const ZOOM_STEP = 1.25;
  const ZOOM_MIN = 0.2;
  const ZOOM_MAX = 3;
  const bigThumbs = new Map();
  let lensUri = null;
  let lensLoading = false;
  let lensZoom = 1;

  const lens = document.createElement("div");
  lens.className = "lens";
  lens.hidden = true;
  lens.setAttribute("role", "dialog");
  lens.setAttribute("aria-modal", "true");
  lens.setAttribute("aria-label", "Enlarged page");
  lens.innerHTML =
    '<div class="lens-bar"><span class="lens-title" id="lens-title"></span>' +
    '<span class="lens-tools">' +
    '<button type="button" data-lens-prev aria-label="Previous page">‹</button>' +
    '<button type="button" data-lens-next aria-label="Next page">›</button>' +
    '<button type="button" data-lens-out aria-label="Zoom out">−</button>' +
    '<button type="button" data-lens-fit aria-label="Fit the whole page">Fit</button>' +
    '<button type="button" data-lens-in aria-label="Zoom in">+</button>' +
    '<button type="button" id="lens-close">Close</button>' +
    "</span></div>" +
    '<div class="lens-stage" id="lens-stage"></div>';
  document.body.appendChild(lens);
  lens.querySelector("#lens-close").addEventListener("click", closeLens);
  lens.querySelector("[data-lens-prev]").addEventListener("click", () => goLens(-1));
  lens.querySelector("[data-lens-next]").addEventListener("click", () => goLens(1));
  lens.querySelector("[data-lens-out]").addEventListener("click", () => zoomLens(1 / ZOOM_STEP));
  lens.querySelector("[data-lens-in]").addEventListener("click", () => zoomLens(ZOOM_STEP));
  lens.querySelector("[data-lens-fit]").addEventListener("click", fitLens);
  // The scrim closes; the page itself does not.
  lens.addEventListener("click", (event) => {
    if (event.target === lens || event.target.id === "lens-stage") closeLens();
  });
  document.addEventListener("keydown", (event) => {
    if (lens.hidden) return;
    if (event.key === "Escape") closeLens();
    else if (event.key === "+" || event.key === "=") zoomLens(ZOOM_STEP);
    else if (event.key === "-") zoomLens(1 / ZOOM_STEP);
    else if (event.key === "ArrowLeft") goLens(-1);
    else if (event.key === "ArrowRight") goLens(1);
  });

  // Which page the lens is on: null is the anchor's own page — the one with
  // a passage to mark, and the one the tile's thumbnail can stand in for.
  let lensPage = null;
  const lensKey = () => `${lensUri}|${lensPage ?? "self"}`;

  function openLens(uri) {
    lensUri = uri;
    lensPage = null;
    lensZoom = 1;
    lens.hidden = false;
    paintLens();
    lens.querySelector("#lens-close").focus();
    call("ui/request-display-mode", { mode: "fullscreen" }).catch(() => {});
    ensureLensPage();
  }

  // Leafing through the document the anchor pins. Turning back onto the
  // anchor's page returns to the `null` key on purpose: that entry carries
  // the highlight, and the tile thumbnail can stand in while it loads.
  function goLens(delta) {
    const current = lensImageNow();
    if (!current || !current.page_count) return;
    const target = Math.max(1, Math.min(current.page + delta, current.page_count));
    if (target === current.page) return;
    const small = thumbs.get(lensUri);
    const anchorPage = small && small.image ? small.image.page : null;
    lensPage = target === anchorPage ? null : target;
    paintLens();
    ensureLensPage();
  }

  function lensImageNow() {
    const small = thumbs.get(lensUri);
    return bigThumbs.get(lensKey()) || (lensPage == null ? small && small.image : null) || null;
  }

  function zoomLens(factor) {
    lensZoom = Math.min(ZOOM_MAX, Math.max(ZOOM_MIN, lensZoom * factor));
    paintLens();
  }

  // The whole page at once, never upscaled past reading width: blur is a
  // poor trade for size.
  function fitLens() {
    const enlarged = bigThumbs.get(lensKey());
    const image = lensImageNow();
    const stage = lens.querySelector("#lens-stage");
    if (!image || !stage) return;
    const box = stage.getBoundingClientRect();
    if (!box.width || !box.height) return;
    const base = enlarged ? enlarged.width : 860;
    const aspect = image.height / image.width;
    const target = Math.min(box.width - 16, (box.height - 16) / aspect);
    lensZoom = Math.min(1, Math.max(ZOOM_MIN, target / base));
    paintLens();
  }

  function closeLens() {
    if (lens.hidden) return;
    lens.hidden = true;
    lensUri = null;
    call("ui/request-display-mode", { mode: "inline" }).catch(() => {});
  }

  async function ensureLensPage() {
    const key = lensKey();
    if (bigThumbs.has(key) || lensLoading) return;
    lensLoading = true;
    const uri = lensUri;
    const page = lensPage;
    try {
      bigThumbs.set(key, await fetchThumb(uri, LENS_WIDTH, page));
    } catch (_) {
      // On the anchor's page the thumbnail already stands in; a failed
      // upgrade costs sharpness, not the answer. On any other, the previous
      // page simply keeps the stage.
    } finally {
      lensLoading = false;
      if (!lens.hidden && lensUri === uri && lensPage === page) {
        paintLens();
      } else if (!lens.hidden) {
        // The reader turned again while this page was rendering.
        ensureLensPage();
      }
    }
  }

  function paintLens() {
    const enlarged = bigThumbs.get(lensKey());
    const image = lensImageNow();
    const title = lens.querySelector("#lens-title");
    if (!image) {
      // Turning to a page not fetched yet: the previous page holds the
      // stage rather than flashing it empty.
      if (title) title.innerHTML = `page <b>${esc(lensPage ?? "…")}</b> · turning…`;
      return;
    }
    const box = image.highlight;
    const mark = box
      ? `<span class="mark" style="left:${(box[0] / image.width) * 100}%;top:${
          (box[1] / image.height) * 100
        }%;width:${((box[2] - box[0]) / image.width) * 100}%;height:${
          ((box[3] - box[1]) / image.height) * 100
        }%"></span>`
      : "";
    const provisional = enlarged ? "" : " provisional";
    const base = enlarged ? image.width : 860;
    const width = Math.round(base * lensZoom);
    // Past 100% the frame's cap comes off: magnifying into a cap would be a
    // button that does nothing.
    const cap = lensZoom > 1 ? "none" : "100%";
    const alt = mark
      ? `Page ${esc(image.page)}, the kept passage boxed`
      : `Page ${esc(image.page)}`;
    lens.querySelector("#lens-stage").innerHTML =
      `<div class="lens-page${provisional}" style="width:${width}px;max-width:${cap}">` +
      `<img alt="${alt}" src="${esc(image.data_uri)}">${mark}</div>`;
    const pages = image.page_count ? ` / ${esc(image.page_count)}` : "";
    const zoom = lensZoom === 1 ? "" : ` · ${Math.round(lensZoom * 100)}%`;
    title.innerHTML =
      `page <b>${esc(image.page)}</b>${pages}${zoom}` + (enlarged ? "" : " · sharpening…");
    lens.querySelector("[data-lens-prev]").disabled = image.page <= 1;
    lens.querySelector("[data-lens-next]").disabled =
      !image.page_count || image.page >= image.page_count;
  }

  // CSS.escape is everywhere the sandbox runs; the fallback quotes enough
  // for a dstudio:// uri or a server-minted step id, the only two things
  // ever interpolated through it.
  const cssEscape = (value) =>
    typeof CSS !== "undefined" && CSS.escape
      ? CSS.escape(value)
      : String(value).replaceAll(/["\\\]]/g, "\\$&");

  function selectTab(tab) {
    activeTab = tab;
    root.dataset.view = tab;
    root.querySelectorAll(".tab").forEach((button) => {
      const selected = button.dataset.tab === tab;
      button.setAttribute("aria-selected", String(selected));
      button.tabIndex = selected ? 0 : -1;
    });
    if (tab === "path") hydratePath();
    reportSize();
  }

  function nodeRow(node) {
    // `level` is the document's own heading depth; the first level sits flush
    // so a single-chapter map does not open on a wasted indent.
    const indent = Math.max(0, (Number(node.level) || 0) - 1) * 11;
    const steps = (node.step_ids || []).join(" ");
    return `<button class="node" data-status="${esc(node.status)}" data-steps="${esc(steps)}"
      title="${esc(node.ref)}">
      <span class="pin"></span>
      <span>
        <span class="label" style="padding-left:${indent}px">${esc(node.title)}</span>
        ${node.page ? `<span class="page"> p.${esc(node.page)}</span>` : ""}
      </span>
    </button>`;
  }

  function stepBlock(step, view) {
    const attempts = Array.isArray(step.attempts) ? step.attempts : [];
    return `<div class="step" data-step="${esc(step.step_id)}">
      <button class="step-head" data-step-toggle="${esc(step.step_id)}">
        <span>
          <span class="step-q"><span class="ord">${esc(step.ordinal)}.</span>${esc(step.question)}</span>
          ${step.why ? `<div class="step-why">${esc(step.why)}</div>` : ""}
        </span>
        <span>
          <span class="pips">${wasAbandoned(step) ? "" : pips(attempts, view.max_attempts_per_step)}</span>
          <span class="state ${esc(step.state)}">${esc(stateLabel(step))}</span>
        </span>
      </button>
      ${attempts.length ? `<div class="attempts">${attempts.map(attemptRow).join("")}</div>` : ""}
    </div>`;
  }

  // One mark per attempt the step was allowed, filled left to right as they
  // are spent. Three filled and none green is a step the document did not
  // answer — which is a finding, and should look like one.
  function pips(attempts, cap) {
    const budget = Math.max(Number(cap) || attempts.length, attempts.length);
    const marks = attempts.map((attempt) => {
      if (isKept(attempt.outcome)) return '<span class="pip kept"></span>';
      if (isRejected(attempt.outcome)) return '<span class="pip rejected"></span>';
      return '<span class="pip pending"></span>';
    });
    for (let i = attempts.length; i < budget; i += 1) marks.push('<span class="pip left"></span>');
    return marks.join("");
  }

  function attemptRow(attempt) {
    const outcome = attempt.outcome || "";
    const cited = attempt.kept_uri || attempt.uri;
    return `<div class="attempt ${isRejected(outcome) ? "rejected" : ""}" data-outcome="${esc(outcome)}">
      ${attempt.thought ? `<div class="thought">${esc(attempt.thought)}</div>` : ""}
      <div class="verdict">
        <span class="chip ${isKept(outcome) ? "kept" : isRejected(outcome) ? "rejected" : ""}">${esc(OUTCOMES[outcome] || "pending")}</span>
        <span class="ref">${esc(refOf(cited))}</span>
        ${attempt.detail ? `<span class="detail">${esc(attempt.detail)}</span>` : ""}
      </div>
      ${attempt.actual_quote ? `<div class="said"><b>The page says:</b> ${esc(attempt.actual_quote)}</div>` : ""}
    </div>`;
  }

  // The fragment is the readable half of an anchor; the document and version
  // are already stated once in the header and repeating them on every row
  // would push the verdict off the side of a narrow card.
  function refOf(uri) {
    const text = String(uri || "");
    const hash = text.indexOf("#");
    return hash === -1 ? text : text.slice(hash);
  }

  function tally(view, steps) {
    const attempts = steps.reduce((total, step) => total + (step.attempts || []).length, 0);
    const kept = steps.reduce(
      (total, step) => total + (step.attempts || []).filter((a) => isKept(a.outcome)).length,
      0
    );
    const parts = [
      `${view.steps_answered ?? 0} answered`,
      `${view.steps_unanswered ?? 0} unanswered`,
      `${attempts} attempt${attempts === 1 ? "" : "s"}, ${kept} kept`,
    ];
    // The surface total, not this card's: `Ledger` is scoped to one server
    // process, which over HTTP is every client of that backend. Said as
    // "this server", never as "this conversation".
    if (view.total_calls) {
      parts.push(`${num(view.total_est_tokens)} est. tokens over ${view.total_calls} calls on this server`);
    }
    return parts;
  }

  // ---- the two-way link ------------------------------------------------
  // Clicking a step lights the sections it reached; clicking a section lights
  // the steps that reached it. It is the same relation read from either end,
  // and it is the whole reason the map and the timeline sit on one card.

  function wire() {
    root.querySelectorAll("[data-step-toggle]").forEach((button) => {
      button.addEventListener("click", () => highlight([button.dataset.stepToggle]));
    });
    root.querySelectorAll(".node").forEach((button) => {
      button.addEventListener("click", () => {
        const ids = (button.dataset.steps || "").split(" ").filter(Boolean);
        highlight(ids);
      });
    });
    root.querySelectorAll(".tab").forEach((button) => {
      button.addEventListener("click", () => selectTab(button.dataset.tab));
    });
    // The tablist contract: arrows move selection, the selected tab is the
    // one tab stop. Two tabs make the arrows symmetric.
    root.querySelector(".tabs")?.addEventListener("keydown", (event) => {
      if (event.key !== "ArrowLeft" && event.key !== "ArrowRight") return;
      event.preventDefault();
      selectTab(activeTab === "record" ? "path" : "record");
      root.querySelector(`.tab[data-tab="${activeTab}"]`)?.focus();
    });
    const fold = root.querySelector("[data-fold]");
    if (fold) {
      fold.addEventListener("click", () => {
        treeCollapsed = !treeCollapsed;
        fold.setAttribute("aria-expanded", String(!treeCollapsed));
        root.querySelector(".tree")?.classList.toggle("collapsed", treeCollapsed);
        reportSize();
      });
    }
    // A hop is the same step the timeline lists: its words land on that step
    // in the record, lit — the two readings stay one record. `lit` is
    // cleared first because highlight() is a toggle, and landing on a step
    // that happened to be lit already must not arrive with the light off.
    // Its page enlarges instead — and a shot with nothing to enlarge jumps
    // like the words do, so no part of a tile is dead.
    const jump = (hop) => {
      selectTab("record");
      lit = "";
      highlight([hop.dataset.hop]);
      root
        .querySelector(`.step[data-step="${cssEscape(hop.dataset.hop)}"]`)
        ?.scrollIntoView({ block: "nearest" });
    };
    root.querySelectorAll(".hop [data-jump]").forEach((button) => {
      button.addEventListener("click", () => jump(button.closest(".hop")));
    });
    root.querySelectorAll(".hop [data-shot]").forEach((button) => {
      button.addEventListener("click", () => {
        const hop = button.closest(".hop");
        const cached = thumbs.get(hop.dataset.uri);
        if (cached && cached.image) openLens(hop.dataset.uri);
        else jump(hop);
      });
    });
  }

  let lit = "";
  function highlight(stepIds) {
    const key = stepIds.slice().sort().join(" ");
    const clearing = key === lit || !stepIds.length;
    lit = clearing ? "" : key;
    const wanted = new Set(clearing ? [] : stepIds);

    root.querySelectorAll(".step").forEach((element) => {
      element.classList.toggle("lit", wanted.has(element.dataset.step));
    });
    root.querySelectorAll(".node").forEach((element) => {
      const reached = (element.dataset.steps || "").split(" ").filter(Boolean);
      element.classList.toggle("lit", reached.some((id) => wanted.has(id)));
    });
  }

  function post(message) {
    try { window.parent?.postMessage(message, "*"); } catch (_) { /* no host, no-op */ }
  }

  // ---- the bridge ------------------------------------------------------
  // JSON-RPC 2.0 over postMessage, as the MCP Apps spec defines it. The
  // record renders from the tool result alone; the only fetches are the
  // handshake and, when the path is opened, `get_investigation_page` — one
  // thumbnail per kept ref, never eagerly, and the same page again at
  // reading width when someone enlarges it.

  const pending = new Map();
  let nextRequestId = 1;
  // Named so the thumbnail cache can tell a local timeout — worth retrying —
  // from an answer the server actually gave.
  const TIMEOUT_MESSAGE = "the host did not answer";

  function call(method, params, timeoutMs = 8000) {
    return new Promise((resolve, reject) => {
      const id = `app-${nextRequestId++}`;
      const timer = setTimeout(() => {
        pending.delete(id);
        reject(new Error(TIMEOUT_MESSAGE));
      }, timeoutMs);
      pending.set(id, { resolve, reject, timer });
      post({ jsonrpc: "2.0", id, method, params });
    });
  }

  function settle(data) {
    const entry = data && data.id != null && pending.get(data.id);
    if (!entry) return false;
    pending.delete(data.id);
    clearTimeout(entry.timer);
    if (data.error) entry.reject(new Error(data.error.message || "call failed"));
    else entry.resolve(data.result);
    return true;
  }

  // ---- handshake -------------------------------------------------------
  // `ui/initialize`, then `ui/notifications/initialized` once the host has
  // answered. The notification is what allows the host to push the tool
  // result at all, so it is sent even when the request fails — withholding it
  // on a host that predates the handshake would trade a theme for a blank
  // card. The answer carries the theme to render in and the frame to fit.
  const PROTOCOL_VERSION = "2026-01-26";
  const HANDSHAKE_MS = 2500;
  let host = { capabilities: null, context: {} };
  let ready = null;

  function handshake() {
    if (ready) return ready;
    ready = call(
      "ui/initialize",
      {
        protocolVersion: PROTOCOL_VERSION,
        capabilities: {},
        clientInfo: { name: "docling-studio-investigation", version: "1" },
        appCapabilities: { availableDisplayModes: ["inline"] },
      },
      HANDSHAKE_MS
    )
      .then((result) => {
        host = {
          capabilities: result?.hostCapabilities ?? null,
          context: result?.hostContext ?? {},
        };
        applyHostContext(host.context);
        return true;
      })
      .catch(() => false)
      .then((negotiated) => {
        post({ jsonrpc: "2.0", method: "ui/notifications/initialized", params: {} });
        return negotiated;
      });
    return ready;
  }

  function applyHostContext(context) {
    if (!context || typeof context !== "object") return;
    if (context.theme === "dark" || context.theme === "light") {
      document.documentElement.setAttribute("data-theme", context.theme);
    }
    applyContainerDimensions(context.containerDimensions);
    reportSize();
  }

  // The host owns the frame. A fixed `width` means "fill exactly this"; a
  // `maxWidth` means "grow up to here". `100%` rather than the spec snippet's
  // `100vw`, which counts the scrollbar gutter the client width does not —
  // on any platform with classic scrollbars that is a card a scrollbar wider
  // than its frame, cropped down the side.
  let frame = null;
  function applyContainerDimensions(dimensions) {
    if (!dimensions || typeof dimensions !== "object") return;
    frame = dimensions;
    const style = document.documentElement.style;
    if (typeof dimensions.width === "number") {
      style.width = "100%";
      style.maxWidth = "100%";
    } else if (typeof dimensions.maxWidth === "number") {
      style.maxWidth = `${dimensions.maxWidth}px`;
    }
    if (typeof dimensions.height === "number") style.height = "100%";
    else if (typeof dimensions.maxHeight === "number") {
      style.maxHeight = `${dimensions.maxHeight}px`;
    }
  }

  let lastHeight = 0;
  let lastWidth = 0;
  function reportSize() {
    const main = document.querySelector("main");
    if (!main) return;
    const height = Math.ceil(main.getBoundingClientRect().height);
    // Clamped to what the host declared: a host that honours this width sets
    // the frame from it, so asking for more than it offered is asking to be
    // cropped.
    const ceiling =
      typeof frame?.width === "number"
        ? frame.width
        : typeof frame?.maxWidth === "number"
          ? frame.maxWidth
          : Infinity;
    const width = Math.ceil(Math.min(document.documentElement.clientWidth, ceiling));
    if (!height) return;
    if (Math.abs(height - lastHeight) < 8 && width === lastWidth) return;
    lastHeight = height;
    lastWidth = width;
    post({
      jsonrpc: "2.0",
      method: "ui/notifications/size-changed",
      params: { width, height },
    });
  }

  if (typeof ResizeObserver === "function") {
    new ResizeObserver(reportSize).observe(document.querySelector("main"));
  }

  // Host -> app. Hosts differ in how much of the JSON-RPC envelope reaches
  // the guest, so the payload is dug out of every documented shape rather
  // than betting on one: params.result / result / the message itself,
  // structured content first, then the JSON in the text content block.
  function extract(data) {
    if (!data || typeof data !== "object") return null;
    for (const candidate of [data.params?.result, data.params, data.result, data]) {
      if (!candidate || typeof candidate !== "object") continue;
      const structured = candidate.structuredContent ?? candidate.structured_content;
      if (structured?.investigation_id && structured.reasoning) return structured;
      if (candidate.investigation_id && candidate.reasoning) return candidate;
      const text = candidate.content?.[0]?.text;
      if (typeof text === "string") {
        try {
          const parsed = JSON.parse(text);
          if (parsed?.investigation_id && parsed.reasoning) return parsed;
        } catch (_) { /* not our payload */ }
      }
    }
    return null;
  }

  window.addEventListener("message", (event) => {
    const data = event.data;
    if (settle(data)) return;

    // The host asks before tearing the view down and waits for the answer.
    if (data?.method === "ui/resource-teardown") {
      if (data.id != null) post({ jsonrpc: "2.0", id: data.id, result: {} });
      return;
    }
    if (data?.method === "ui/notifications/host-context-changed") {
      host = { ...host, context: { ...host.context, ...(data.params || {}) } };
      applyHostContext(host.context);
      return;
    }

    const view = extract(data);
    if (view) render(view);
  });

  handshake();
</script>
</body>
</html>
