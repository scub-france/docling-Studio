vulnerabilities:
  # Removed on 2026-11-02 (release 0.7.3 audit): CVE-2026-40393 (mesa),
  # CVE-2026-7598 (libssh2), CVE-2026-42496, CVE-2026-8376 and CVE-2026-13221
  # (perl), CVE-2026-58016 (glib). Debian 13 now ships fixes. The four that had
  # expired no longer show up in the release-gate scan, and the security
  # tracker lists perl 5.40.1-6+deb13u1 and mesa 25.0.7-2+deb13u1 as fixed.
  - id: CVE-2026-6653
    # libxml2 2.12.7+dfsg (Debian 13 trixie), `local` image only.
    # Note the distinction: the application's XML parsing goes through the
    # `lxml` manylinux wheel, which statically bundles its OWN libxml2 — not
    # this Debian system package. The system libxml2 is dpkg/apt + OpenCV
    # tooling and is not fed untrusted input by the backend.
    statement: >-
      libxml2 denial of service. Still no fix: the Debian security tracker
      lists trixie and trixie-security as vulnerable on 2026-11-02. The Debian
      system libxml2 is build/OS tooling; application XML parsing uses the
      lxml wheel's own bundled libxml2. Impact is DoS only, on a deployment
      whose trust model already requires network-level protection (see
      SECURITY.md). Re-evaluate at expiry or when Debian publishes a fix.
    expired_at: 2026-12-31
