minimum_pre_commit_version: "3.7.0"
default_install_hook_types:
  - pre-commit
  - pre-push
  - commit-msg

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-yaml
      - id: check-json
      - id: check-added-large-files
        args:
          - --maxkb=1024
      - id: detect-private-key
      - id: end-of-file-fixer
      - id: trailing-whitespace

  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args:
          - --baseline
          - .secrets.baseline
          - --exclude-files
          - ^(frontend/package-lock\.json|document-parser/uv\.lock|embedding-service/uv\.lock)$

  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.7
    hooks:
      - id: actionlint
        files: ^\.github/workflows/.*\.(yml|yaml)$

  - repo: local
    hooks:
      - id: block-local-generated-artifacts
        name: block local/generated artifacts
        entry: bash ./scripts/check_tracked_local_artifacts.sh
        language: system
        files: .
      - id: commit-msg-conventional
        name: conventional commit message
        entry: bash ./scripts/check_commit_message.sh
        language: system
        stages:
          - commit-msg
        always_run: true
      - id: lockfile-consistency
        name: lockfile consistency
        entry: bash ./scripts/check_lockfile_consistency.sh
        language: system
        files: ^(frontend/package(-lock)?\.json|document-parser/(pyproject\.toml|uv\.lock)|embedding-service/(pyproject\.toml|uv\.lock))$
      - id: docker-compose-validate
        name: docker compose validate
        entry: bash ./scripts/check_docker_compose.sh
        language: system
        files: ^docker-compose.*\.yml$
        pass_filenames: false
      - id: document-parser-ruff-check
        name: document-parser ruff check --fix
        entry: uv run --directory document-parser ruff check --fix .
        language: system
        files: ^document-parser/.*\.py$
        exclude: ^document-parser/local-experiments/
        pass_filenames: false
      - id: document-parser-ruff-format
        name: document-parser ruff format
        entry: uv run --directory document-parser ruff format .
        language: system
        files: ^document-parser/.*\.py$
        exclude: ^document-parser/local-experiments/
        pass_filenames: false
      - id: document-parser-architecture-tests
        name: document-parser architecture tests
        entry: uv run --directory document-parser pytest tests/test_architecture.py -q
        language: system
        files: ^document-parser/(api|domain|infra|persistence|services|tests/test_architecture\.py).*
        exclude: ^document-parser/local-experiments/
        pass_filenames: false
      - id: document-parser-targeted-tests
        name: document-parser targeted tests
        entry: bash ./scripts/run_document_parser_targeted_tests.sh
        language: system
        files: ^document-parser/((api|domain|infra|persistence|services)/.*\.py|main\.py|tests/.*\.py)$
        exclude: ^document-parser/local-experiments/
      - id: embedding-service-ruff-check
        name: embedding-service ruff check --fix
        entry: uv run --directory embedding-service ruff check --fix .
        language: system
        files: ^embedding-service/.*\.py$
        pass_filenames: false
      - id: embedding-service-ruff-format
        name: embedding-service ruff format
        entry: uv run --directory embedding-service ruff format .
        language: system
        files: ^embedding-service/.*\.py$
        pass_filenames: false
      - id: frontend-eslint-fix
        name: frontend eslint --fix
        entry: npm --prefix frontend run lint:fix
        language: system
        files: ^frontend/src/.*\.(js|ts|vue)$
        pass_filenames: false
      - id: frontend-prettier-write
        name: frontend prettier --write
        entry: npm --prefix frontend run format
        language: system
        files: ^frontend/src/.*\.(css|js|json|md|scss|ts|vue)$
        pass_filenames: false
      - id: frontend-targeted-tests
        name: frontend targeted tests
        entry: bash ./scripts/run_frontend_targeted_tests.sh
        language: system
        files: ^frontend/src/.*\.(js|ts|vue)$
      - id: frontend-type-check
        name: frontend type-check
        entry: npm --prefix frontend run type-check
        language: system
        stages:
          - pre-push
        files: ^frontend/src/.*\.(ts|vue)$
        pass_filenames: false
      - id: document-parser-full-tests
        name: document-parser full tests
        entry: uv run --directory document-parser pytest tests/ -q
        language: system
        stages:
          - pre-push
        files: ^document-parser/.*\.py$
        exclude: ^document-parser/local-experiments/
        pass_filenames: false
      - id: frontend-build
        name: frontend build
        entry: npm --prefix frontend run build
        language: system
        stages:
          - pre-push
        files: ^frontend/(src/.*\.(css|js|ts|vue)|package(-lock)?\.json|tsconfig.*\.json|vite\.config\..*)$
        pass_filenames: false
